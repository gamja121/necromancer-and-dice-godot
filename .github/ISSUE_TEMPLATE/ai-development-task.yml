name: "AI 개발 작업 (중단 복구)"
description: "GitHub Issue에 작업 목표와 체크포인트를 보존합니다."
title: "[AI 작업] "
body:
  - type: markdown
    attributes:
      value: |
        공개 저장소입니다. 개인정보, API 키, 의료정보, 개인 저장 데이터를 적지 마세요.
        현재 구현은 작업 기록 및 중단 감지입니다. 실제 Codex 무인 재실행은 아직 연결 전입니다.
  - type: textarea
    id: goal
    attributes:
      label: 작업 목표
      placeholder: "예: 덱 1~4번 선택 순서와 전장 좌→우 배치 일치"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      placeholder: "예: 1·2·4마리 배치 검증 및 실제 모바일 화면 확인"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 수정 허용 범위 및 금지 사항
      placeholder: "보존해야 하는 소스·에셋·전투 규칙"
  - type: textarea
    id: tests
    attributes:
      label: 검증 계획
      placeholder: "Godot import, 관련 테스트, 실제 UI 점검, PR 확인"
