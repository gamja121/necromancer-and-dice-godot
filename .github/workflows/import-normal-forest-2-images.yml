name: Import two uploaded normal battlefield images
on:
  push:
    branches:
      - feat/random-normal-forest-battle-backgrounds-20261110
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact uploaded PNG images from temporary text
        run: |
          base64 --decode assets/battle/backgrounds/_import_tmp/castle-forest.png.b64 > assets/battle/backgrounds/castle-forest.png
          base64 --decode assets/battle/backgrounds/_import_tmp/graveyard-forest.png.b64 > assets/battle/backgrounds/graveyard-forest.png
          printf '%s  %s\n' \
            f9236765a944ff0aa8a3fa41a16c05c322802568d88266f648e0b9ba66947995 assets/battle/backgrounds/castle-forest.png \
            7ef83635954418933c061bee809c0bdd8f590cfd6fca41e2723db3b712b0fd97 assets/battle/backgrounds/graveyard-forest.png | sha256sum -c -
      - name: Commit uploaded art on isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/battle/backgrounds/castle-forest.png assets/battle/backgrounds/graveyard-forest.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import two original normal battlefield PNG variants"
          git push origin "HEAD:${GITHUB_REF_NAME}"
