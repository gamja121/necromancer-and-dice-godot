name: Verify cemetery title

on:
  push:
    branches:
      - chatgpt/title-cemetery-master-20261009
    paths:
      - ".github/workflows/verify-cemetery-title.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify new title assets and old-art removal
        shell: bash
        run: |
          set -euo pipefail
          for f in             01_sky.webp             02_mountains.webp             03_fence_tree.webp             04_ground_hand.webp             05_graves_crows.webp             06_flying_crows.webp
          do
            test -s "assets/title/cemetery/$f"
          done
          test ! -e assets/title/parallax/background.webp
          test ! -e assets/title/parallax/board_layer.webp
          test ! -e assets/title/parallax/foreground_layer.webp
          grep -q 'ParallaxArt/Sky' title.gd
          grep -q 'ParallaxArt/FlyingCrows' title.gd
          grep -q 'assets/title/cemetery/01_sky.webp' title.tscn
          grep -q 'assets/title/cemetery/06_flying_crows.webp' title.tscn

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' import.log; then
            echo "Godot import reported an error."
            exit 1
          fi

      - name: Boot title scene
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 3 2>&1 | tee boot.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' boot.log; then
            echo "Title boot reported an error."
            exit 1
          fi
