name: Optional UI Typography Preview
on:
  pull_request:
    paths:
      - "systems/ui_typography.gd"
      - "scripts/test_ui_typography_preview.gd"
      - "project.godot"
      - ".github/workflows/ui-typography-preview.yml"
  push:
    branches:
      - main
    paths:
      - "systems/ui_typography.gd"
      - "scripts/test_ui_typography_preview.gd"
      - "project.godot"
      - ".github/workflows/ui-typography-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typography:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import and validate all project scripts
        run: |
          set -euo pipefail
          timeout 110s godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' import.log; then exit 1; fi
      - name: Verify information UI and story-font separation
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . --script res://scripts/test_ui_typography_preview.gd 2>&1 | tee preview.log
          grep -E 'UI_TYPOGRAPHY_PREVIEW: [0-9]+ passed, 0 failed' preview.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL ui-typography:' preview.log; then exit 1; fi
