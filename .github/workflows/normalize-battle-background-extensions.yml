name: Correct JPEG signatures of uploaded battle art
on:
  push:
    branches: [feat/random-normal-forest-battle-backgrounds-20261110]
permissions:
  contents: write
jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bytes and commit accurate extensions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          for name, expected in [
              ("castle-forest", "f9236765a944ff0aa8a3fa41a16c05c322802568d88266f648e0b9ba66947995"),
              ("graveyard-forest", "7ef83635954418933c061bee809c0bdd8f590cfd6fca41e2723db3b712b0fd97"),
          ]:
              path = Path("assets/battle/backgrounds") / (name+".png")
              data = path.read_bytes()
              assert data[:3] == bytes.fromhex("ffd8ff"), name+" is JPEG encoded"
              assert hashlib.sha256(data).hexdigest() == expected, name+" unexpectedly changed"
          PY
          git mv assets/battle/backgrounds/castle-forest.png assets/battle/backgrounds/castle-forest.jpg
          git mv assets/battle/backgrounds/graveyard-forest.png assets/battle/backgrounds/graveyard-forest.jpg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Rename source JPEG-encoded battle art to proper JPG extensions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
