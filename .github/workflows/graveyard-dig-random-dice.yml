name: Graveyard Random Dice Dig (Godot)
on:
  push:
    branches:
      - main
      - fix/graveyard-dig-random-dice-20261021
    paths:
      - "map.gd"
      - "systems/run_session.gd"
      - "systems/map_state.gd"
      - "systems/exploration_actions.gd"
      - "systems/reward_overflow.gd"
      - "scripts/test_graveyard_random_dice.gd"
      - "scripts/test_graveyard_extraction_exit.gd"
      - "scripts/test_ui_graveyard_event_parity.gd"
      - ".github/workflows/graveyard-dig-random-dice.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graveyard-dig:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Godot script import
        shell: bash
        run: |
          set -euo pipefail
          timeout 160s godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' import.log; then exit 1; fi
      - name: Dice rewards - one visit, save, full deck and rollback
        shell: bash
        run: |
          set -euo pipefail
          timeout 130s godot --headless --path . --script res://scripts/test_graveyard_random_dice.gd 2>&1 | tee grave-dice.log
          grep -E 'GRAVEYARD_RANDOM_DICE: [0-9]+ passed, 0 failed' grave-dice.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL grave-dice:' grave-dice.log; then exit 1; fi
      - name: Cemetery action and map exit - real UI
        shell: bash
        run: |
          set -euo pipefail
          timeout 145s godot --headless --path . --script res://scripts/test_graveyard_extraction_exit.gd 2>&1 | tee grave-exit.log
          grep -E 'GRAVEYARD_EXTRACTION_EXIT: [0-9]+ passed, 0 failed' grave-exit.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL graveyard-exit:' grave-exit.log; then exit 1; fi
      - name: Graveyard story preserved and dice reward UI
        shell: bash
        run: |
          set -euo pipefail
          timeout 145s godot --headless --path . --script res://scripts/test_ui_graveyard_event_parity.gd 2>&1 | tee grave-story.log
          grep -E 'UI_STAGE4_PARITY: [0-9]+ passed, 0 failed' grave-story.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL ui-stage4:' grave-story.log; then exit 1; fi
