name: Battle Brand Reference HTML Visual Port 5A
on:
  pull_request:
    paths:
      - "systems/brand_reference.gd"
      - "battlefield.gd"
      - "scripts/test_ui_battle_brand_parity.gd"
      - "assets/map/ui/inheritance_info.webp"
      - ".github/workflows/ui-battle-brand-stage5a.yml"
  push:
    branches:
      - feature/ui-parity-battle-brand-stage5a-20261011
      - main
    paths:
      - "systems/brand_reference.gd"
      - "battlefield.gd"
      - "scripts/test_ui_battle_brand_parity.gd"
      - "assets/map/ui/inheritance_info.webp"
      - ".github/workflows/ui-battle-brand-stage5a.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brand-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Godot project import and GDScript parse
        shell: bash
        run: |
          set -euo pipefail
          timeout 110s godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' import.log; then exit 1; fi
      - name: Actual dice-face source artwork brand matrix and read-only operation
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . --script res://scripts/test_ui_battle_brand_parity.gd 2>&1 | tee brand-ui.log
          grep -E 'UI_BATTLE_BRAND_PARITY: [0-9]+ passed, 0 failed' brand-ui.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL ui-brand-reference:' brand-ui.log; then exit 1; fi
      - name: Original curse-first battle brand resolver remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          timeout 95s godot --headless --path . --script res://scripts/test_battle_source_parity.gd 2>&1 | tee battle-parity.log
          grep -E 'BATTLE_SOURCE_PARITY_REGRESSION: [0-9]+ passed, 0 failed' battle-parity.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL battle-parity:' battle-parity.log; then exit 1; fi
      - name: P4 actual battlefield-to-map result and saved encounter flow
        shell: bash
        run: |
          set -euo pipefail
          timeout 235s godot --headless --path . --script res://scripts/test_p4_combat_map_return_integration.gd 2>&1 | tee battle-return.log
          grep -E 'P4_COMBAT_MAP_RETURN_INTEGRATION: [0-9]+ passed, 0 failed' battle-return.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-combat:' battle-return.log; then exit 1; fi
