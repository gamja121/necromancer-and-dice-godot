name: Clear Action UI Regression
on:
  pull_request:
    paths:
      - "map.gd"
      - "systems/treasure_reward.gd"
      - "systems/place_actions.gd"
      - "systems/home_inheritance.gd"
      - "systems/battle_deck.gd"
      - "systems/exploration_actions.gd"
      - "scripts/test_ui_treasure_reward_parity.gd"
      - "scripts/test_shop_ui_parity.gd"
      - "scripts/test_ui_route_inheritance_parity.gd"
      - "scripts/test_ui_fortune_prophecy_stage5l.gd"
      - "scripts/test_ui_world_tree_shared_die.gd"
      - ".github/workflows/ui-action-clarity-pass.yml"
  push:
    branches: [main]
    paths:
      - "map.gd"
      - "systems/treasure_reward.gd"
      - "systems/place_actions.gd"
      - "systems/home_inheritance.gd"
      - "systems/battle_deck.gd"
      - "systems/exploration_actions.gd"
      - "scripts/test_ui_treasure_reward_parity.gd"
      - "scripts/test_shop_ui_parity.gd"
      - "scripts/test_ui_route_inheritance_parity.gd"
      - "scripts/test_ui_fortune_prophecy_stage5l.gd"
      - "scripts/test_ui_world_tree_shared_die.gd"
      - ".github/workflows/ui-action-clarity-pass.yml"
permissions:
  contents: read
jobs:
  action-clarity:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Parse imported Godot resources
        run: |
          set -euo pipefail
          timeout 190s godot --headless --path . --editor --quit 2>&1 | tee parse.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|SHADER ERROR' parse.log; then exit 1; fi
      - name: Explicit treasure selection and reward claim
        run: |
          set -euo pipefail
          timeout 150s godot --headless --path . --script res://scripts/test_ui_treasure_reward_parity.gd 2>&1 | tee treasure.log
          grep -E 'UI_TREASURE_REWARD_PARITY: [0-9]+ passed, 0 failed' treasure.log
          if grep -E 'SCRIPT ERROR|Parse Error|FAIL ui-treasure:' treasure.log; then exit 1; fi
      - name: Explicit shop trade and irreversible cost
        run: |
          set -euo pipefail
          timeout 110s godot --headless --path . --script res://scripts/test_shop_ui_parity.gd 2>&1 | tee shop.log
          grep -E 'SHOP_UI_PARITY: [0-9]+ passed, 0 failed' shop.log
          if grep -E 'SCRIPT ERROR|Parse Error|FAIL shop-ui-parity:' shop.log; then exit 1; fi
      - name: Fortune used-result reopening and one-time die
        run: |
          set -euo pipefail
          timeout 140s godot --headless --path . --script res://scripts/test_ui_fortune_prophecy_stage5l.gd 2>&1 | tee fortune.log
          grep -E 'UI_FORTUNE_PROPHECY_PARITY: [0-9]+ passed, 0 failed' fortune.log
          if grep -E 'SCRIPT ERROR|Parse Error|FAIL ui-fortune:' fortune.log; then exit 1; fi
      - name: World tree used-result reopening and one-time die
        run: |
          set -euo pipefail
          timeout 140s godot --headless --path . --script res://scripts/test_ui_world_tree_shared_die.gd 2>&1 | tee prayer.log
          grep -E 'WORLD_TREE_SHARED_DIE: [0-9]+ passed, 0 failed' prayer.log
          if grep -E 'SCRIPT ERROR|Parse Error|FAIL prayer-die:' prayer.log; then exit 1; fi
