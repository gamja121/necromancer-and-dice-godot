name: Mimic Treasure Battle and Persistence Regression
on:
  pull_request:
    paths:
      - 'scripts/test_mimic_encounter_isolated.gd'
      - 'systems/map_state.gd'
      - 'systems/run_session.gd'
      - 'systems/treasure_reward.gd'
      - 'systems/encounter_generator.gd'
      - '.github/workflows/mimic-encounter-regression.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/test_mimic_encounter_isolated.gd'
      - 'systems/map_state.gd'
      - 'systems/run_session.gd'
      - 'systems/treasure_reward.gd'
      - 'systems/encounter_generator.gd'
      - '.github/workflows/mimic-encounter-regression.yml'
permissions:
  contents: read
jobs:
  mimic:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import Godot
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' import.log; then exit 1; fi
      - name: Mimic 10-percent chest, original battle, capture/terminal defeat and save reload
        shell: bash
        run: |
          set -euo pipefail
          timeout 460s godot --headless --path . --script res://scripts/test_mimic_encounter_isolated.gd 2>&1 | tee mimic.log
          grep -E '^MIMIC_ISOLATED: [0-9]+ passed, 0 failed$' mimic.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|Invalid call|FAIL mimic-isolated:' mimic.log; then exit 1; fi
