name: Terminal game over and shattering dice
on:
  pull_request:
    paths:
      - "map.gd"
      - "battlefield.gd"
      - "systems/map_state.gd"
      - "systems/run_session.gd"
      - "systems/game_over_screen.gd"
      - "scripts/test_game_over_shatter.gd"
      - "scripts/test_p4_combat_map_return_integration.gd"
      - ".github/workflows/game-over-shatter.yml"
  push:
    branches: [main]
    paths:
      - "map.gd"
      - "battlefield.gd"
      - "systems/map_state.gd"
      - "systems/run_session.gd"
      - "systems/game_over_screen.gd"
      - "scripts/test_game_over_shatter.gd"
      - "scripts/test_p4_combat_map_return_integration.gd"
      - ".github/workflows/game-over-shatter.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terminal-defeat:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Parse game-over UI and scripts
        shell: bash
        run: |
          set -euo pipefail
          timeout 200s godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|SHADER ERROR' import.log; then exit 1; fi
      - name: Actual terminal run and textured dice fracture
        shell: bash
        run: |
          set -euo pipefail
          timeout 230s godot --headless --path . --script res://scripts/test_game_over_shatter.gd 2>&1 | tee gameover.log
          grep -E '^GAME_OVER_SHATTER: [0-9]+ passed, 0 failed$' gameover.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|^FAIL game-over:' gameover.log; then exit 1; fi
      - name: Old battle, saved capture and defeated-run route
        shell: bash
        run: |
          set -euo pipefail
          timeout 520s godot --headless --path . --script res://scripts/test_p4_combat_map_return_integration.gd 2>&1 | tee battle.log
          grep -E '^P4_COMBAT_MAP_RETURN_INTEGRATION: [0-9]+ passed, 0 failed$' battle.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|^FAIL p4-combat:' battle.log; then exit 1; fi
      - name: Preservation of existing battle entry summon sequence
        shell: bash
        run: |
          set -euo pipefail
          timeout 260s godot --headless --path . --script res://scripts/test_battle_entry_summon.gd 2>&1 | tee summon.log
          grep -E '^BATTLE_ENTRY_SUMMON: [0-9]+ passed, 0 failed$' summon.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|^FAIL entry-summon:' summon.log; then exit 1; fi
      - name: Whitespace check
        run: git diff --check
