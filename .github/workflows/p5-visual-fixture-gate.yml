name: P5 Changed Art Story Fixture Gate
on:
  pull_request:
    paths:
      - 'scripts/test_p5_changed_visual_runtime.gd'
      - '.github/workflows/p5-visual-fixture-gate.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/test_p5_changed_visual_runtime.gd'
      - '.github/workflows/p5-visual-fixture-gate.yml'
jobs:
  check-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import real resources
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' import.log; then exit 1; fi
      - name: Validate four art scene paths and original story gate progression
        shell: bash
        run: |
          set -euo pipefail
          timeout 210s godot --headless --path . --script res://scripts/test_p5_changed_visual_runtime.gd 2>&1 | tee visual.log
          grep -E '^P5_03B_VISUAL_RUNTIME: [0-9]+ passed, 0 failed, 4 changed illustrations checked' visual.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p5-changed-visual:' visual.log; then exit 1; fi
