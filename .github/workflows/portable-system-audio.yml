name: Portable System Default Audio Output
on:
  pull_request:
    paths:
      - "systems/audio_settings.gd"
      - "scripts/test_ui_map_audio_options_stage5m.gd"
      - "scripts/test_title_audio_parity.gd"
      - ".github/workflows/portable-system-audio.yml"
  push:
    branches: [main]
    paths:
      - "systems/audio_settings.gd"
      - "scripts/test_ui_map_audio_options_stage5m.gd"
      - "scripts/test_title_audio_parity.gd"
      - ".github/workflows/portable-system-audio.yml"
permissions:
  contents: read
jobs:
  portable-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import and parse Godot project
        shell: bash
        run: |
          set -euo pipefail
          timeout 160s godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' import.log; then exit 1; fi
      - name: Default audio output, old Realtek save migration and map UI
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path . --script res://scripts/test_ui_map_audio_options_stage5m.gd 2>&1 | tee map-audio.log
          grep -E '^UI_MAP_AUDIO_OPTIONS_PARITY: [0-9]+ passed, 0 failed$' map-audio.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL ui-map-audio:' map-audio.log; then exit 1; fi
      - name: Title startup, volume persistence and legacy output cleanup
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path . --script res://scripts/test_title_audio_parity.gd 2>&1 | tee title-audio.log
          grep -E '^TITLE_AUDIO_PARITY_REGRESSION: [0-9]+ passed, 0 failed$' title-audio.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL title-audio:' title-audio.log; then exit 1; fi
      - name: Event/location overlays still hide audio options
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path . --script res://scripts/test_ui_map_overlay_audio_stage5q.gd 2>&1 | tee overlay.log
          grep -E '^UI_MAP_OVERLAY_AUDIO_PARITY: [0-9]+ passed, 0 failed$' overlay.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL ui-map-overlay-audio:' overlay.log; then exit 1; fi
      - name: Confirm system default is the only explicit output route
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'AudioServer.output_device = "Default"' systems/audio_settings.gd
          if grep -E 'Realtek|get_output_device_list|MapAudioOutputDevice|settings.set_value\("audio","output"' systems/audio_settings.gd; then exit 1; fi
          git diff --check
