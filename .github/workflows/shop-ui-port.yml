name: Original Merchant Shop Port (Feature Branch)
on:
  push:
    branches: [feature/ui-parity-shop-stage2-20261011]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shop-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download original merchant counter and verify SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/map/ui
          SOURCE=https://raw.githubusercontent.com/gamja121/necromancer-dice-board/e13d5149fcecc802e5d626f3bef6e5daecd3d66c/art/v2-style/ui/monster-shop-counter.png
          if [ ! -f assets/map/ui/monster-shop-counter.png ]; then
            curl -fL --retry 3 --connect-timeout 15 --max-time 90 "$SOURCE" -o assets/map/ui/monster-shop-counter.png
          fi
          test "$(git hash-object assets/map/ui/monster-shop-counter.png)" = a5a8a79b08d1b22a865b501842c49af9d87e406a
      - name: Commit verified art into feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = feature/ui-parity-shop-stage2-20261011
          if ! git ls-files --error-unmatch assets/map/ui/monster-shop-counter.png >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/map/ui/monster-shop-counter.png
            git commit -m "assets(ui): add verified original shop counter [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Godot import and script parse
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' import.log; then exit 1; fi
      - name: Original shop frame and scroll regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 100s godot --headless --path . --script res://scripts/test_shop_ui_parity.gd 2>&1 | tee shop-ui.log
          grep -E 'SHOP_UI_PARITY: [0-9]+ passed, 0 failed' shop-ui.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL shop-ui-parity:' shop-ui.log; then exit 1; fi
      - name: P4 map and location regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 130s godot --headless --path . --script res://scripts/test_p4_map_move_location_integration.gd 2>&1 | tee map.log
          grep -E 'P4_MAP_LOCATION_INTEGRATION: [0-9]+ passed, 0 failed' map.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-map-location:' map.log; then exit 1; fi
      - name: P4 one-run gameplay regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 225s godot --headless --path . --script res://scripts/test_p4_single_run_end_to_end.gd 2>&1 | tee e2e.log
          grep -E 'P4_SINGLE_RUN_END_TO_END: [0-9]+ passed, 0 failed' e2e.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-single-run:' e2e.log; then exit 1; fi
