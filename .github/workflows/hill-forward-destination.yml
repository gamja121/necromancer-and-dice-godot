name: Hill Forward Destination Choice Godot
on:
  push:
    branches:
      - feature/hill-choose-forward-1to6-20261012
      - main
    paths:
      - "map.gd"
      - "systems/run_session.gd"
      - "systems/exploration_actions.gd"
      - "systems/hill_route_picker.gd"
      - "systems/location_notice_strip.gd"
      - "scripts/test_hill_route_picker.gd"
      - "scripts/test_hill_route_picker_capture.gd"
      - "scripts/test_hill_forward_choice.gd"
      - "scripts/test_p4_map_move_location_integration.gd"
      - "scripts/test_ui_location_layout_stage5s.gd"
      - ".github/workflows/hill-forward-destination.yml"
  pull_request:
    paths:
      - "map.gd"
      - "systems/run_session.gd"
      - "systems/exploration_actions.gd"
      - "systems/hill_route_picker.gd"
      - "systems/location_notice_strip.gd"
      - "scripts/test_hill_route_picker.gd"
      - "scripts/test_hill_route_picker_capture.gd"
      - "scripts/test_hill_forward_choice.gd"
      - "scripts/test_p4_map_move_location_integration.gd"
      - "scripts/test_ui_location_layout_stage5s.gd"
      - ".github/workflows/hill-forward-destination.yml"
  workflow_dispatch:
permissions:
  contents: read
# Avoid obsolete branch/PR tests consuming runners after a newer commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  hill-forward-godot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project and verify GDScript parsing
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s godot --headless --path . --editor --quit 2>&1 | tee hill-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|SHADER ERROR' hill-import.log; then exit 1; fi
      - name: Six forward choices actual UI and save-boundary scenarios
        shell: bash
        run: |
          set -euo pipefail
          timeout 220s godot --headless --path . --script res://scripts/test_hill_forward_choice.gd 2>&1 | tee hill-forward.log
          grep -E '^HILL_FORWARD_CHOICE: [0-9]+ passed, 0 failed$' hill-forward.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|^FAIL hill-forward:' hill-forward.log; then exit 1; fi
      - name: Approved route picker state, original art and save rollback
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s godot --headless --path . --script res://scripts/test_hill_route_picker.gd 2>&1 | tee hill-picker.log
          grep -E '^HILL_ROUTE_PICKER: [0-9]+ passed, 0 failed$' hill-picker.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB.*leaked|^FAIL hill-picker:' hill-picker.log; then exit 1; fi
      - name: Actual graphical hill choice, flag and HOME boundary
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a -s '-screen 0 1600x900x24' godot --path . --rendering-method gl_compatibility --audio-driver Dummy --verbose --fixed-fps 30 --script res://scripts/test_hill_route_picker_capture.gd 2>&1 | tee hill-capture.log
          grep -E '^HILL_ROUTE_CAPTURE: [0-9]+ passed, 0 failed$' hill-capture.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB.*leaked|^FAIL hill-capture:' hill-capture.log; then exit 1; fi
          test -s hill_route_01_choose.png
          test -s hill_route_02_selected.png
          test -s hill_route_03_home_limit.png
      - name: Upload actual hill UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hill-route-picker-native
          path: hill_route_*.png
          if-no-files-found: warn
      - name: Regression actual map travel across the seven location families
        shell: bash
        run: |
          set -euo pipefail
          timeout 310s godot --headless --path . --script res://scripts/test_p4_map_move_location_integration.gd 2>&1 | tee location.log
          grep -E '^P4_MAP_LOCATION_INTEGRATION: [0-9]+ passed, 0 failed$' location.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|^FAIL p4-map-location:' location.log; then exit 1; fi
      - name: Location art and original scene frame remains intact
        shell: bash
        run: |
          set -euo pipefail
          timeout 170s godot --headless --path . --script res://scripts/test_ui_location_layout_stage5s.gd 2>&1 | tee location-ui.log
          grep -E '^UI_LOCATION_LAYOUT_STAGE5S: [0-9]+ passed, 0 failed$' location-ui.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|^FAIL ui-location-layout:' location-ui.log; then exit 1; fi
      - name: Natural home lap and story entrance still work
        shell: bash
        run: |
          set -euo pipefail
          timeout 230s godot --headless --path . --script res://scripts/test_p4_natural_home_lap.gd 2>&1 | tee home.log
          grep -E '^P4_NATURAL_HOME_LAP: [0-9]+ passed, 0 failed$' home.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|^FAIL p4-natural:' home.log; then exit 1; fi
      - name: Verify tracked source file hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.godot|source_assets|raw_assets)/|(^|/)\.env$|\.pck$|\.exe$'; then exit 1; fi
          git diff --check
          echo "HILL_FORWARD_SOURCE_HYGIENE_PASS"
