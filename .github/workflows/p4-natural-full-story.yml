name: P4 Natural Full Story Chain (Godot)

on:
  pull_request:
    paths:
      - "scripts/test_p4_natural_full_story.gd"
      - "scripts/test_p4_full_source_story_chain.gd"
      - "scripts/test_p4_natural_commander_hunter.gd"
      - "scripts/test_p4_natural_story_arrival.gd"
      - ".github/workflows/p4-natural-full-story.yml"
      - ".github/workflows/p4-natural-commander-hunter.yml"
      - "map.gd"
      - "systems/**"
      - "docs/port_audit/migration_work_queue.tsv"
  push:
    branches: [main]
    paths:
      - "scripts/test_p4_natural_full_story.gd"
      - "scripts/test_p4_natural_commander_hunter.gd"
      - "scripts/test_p4_natural_story_arrival.gd"
      - ".github/workflows/p4-natural-full-story.yml"
      - ".github/workflows/p4-natural-commander-hunter.yml"
      - "map.gd"
      - "systems/**"
      - "docs/port_audit/migration_work_queue.tsv"
  workflow_dispatch:

permissions:
  contents: read

# Latest-commit-wins per branch/PR. Older same-workflow runs cannot waste
# Godot imports after a newer revision supersedes them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  natural-full-story:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout canonical Godot source
        uses: actions/checkout@v4
      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project and check native script inheritance
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee p4-natural-full-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' p4-natural-full-import.log; then
            exit 1
          fi
      - name: Natural commander and hunter source chain (shared Godot import)
        id: commander_chain
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 720s godot --headless --path . --script res://scripts/test_p4_natural_commander_hunter.gd 2>&1 | tee p4-natural-commander.log
          grep -E '^P4_NATURAL_COMMANDER_HUNTER: [0-9]+ passed, 0 failed$' p4-natural-commander.log
          grep -E '^P4_NATURAL_COMMANDER_HUNTER_ROUTE: [0-9]+ commander rolls, [0-9]+ hunter rolls, [0-9]+ original house shuffles$' p4-natural-commander.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|Invalid call|FAIL p4-natural:' p4-natural-commander.log; then
            exit 1
          fi
      - name: Natural stochastic late-story movement and persisted mimic interruption
        id: natural_travel
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 960s godot --headless --path . --script res://scripts/test_p4_natural_full_story.gd 2>&1 | tee p4-natural-full-story.log
          grep -E '^P4_NATURAL_LONG_TRAVEL: [0-9]+ passed, 0 failed$' p4-natural-full-story.log
          grep -E '^P4_NATURAL_LONG_TRAVEL: cultist=(true|false) altar=(true|false) portal=(true|false) hunt=(true|false) mimic_interrupt=(true|false); [0-9]+ late house shuffles$' p4-natural-full-story.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|Invalid call|FAIL p4-natural:' p4-natural-full-story.log; then
            exit 1
          fi
      - name: Strict original source-story chain with all eight event results and JSON reload
        id: full_source_chain
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 1200s godot --headless --path . --script res://scripts/test_p4_full_source_story_chain.gd 2>&1 | tee p4-full-source-chain.log
          grep -E '^P4_FULL_SOURCE_STORY_CHAIN: [0-9]+ passed, 0 failed$' p4-full-source-chain.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|Invalid call|FAIL p4-chain:' p4-full-source-chain.log; then exit 1; fi
      - name: Require natural travel AND mandatory complete source-story tests
        if: always()
        shell: bash
        env:
          COMMANDER_OUTCOME: ${{ steps.commander_chain.outcome }}
          NATURAL_TRAVEL_OUTCOME: ${{ steps.natural_travel.outcome }}
          FULL_SOURCE_OUTCOME: ${{ steps.full_source_chain.outcome }}
        run: |
          echo "Commander Hunter: $COMMANDER_OUTCOME"
          echo "Stochastic long travel: $NATURAL_TRAVEL_OUTCOME"
          echo "Full canonical source-story chain: $FULL_SOURCE_OUTCOME"
          if [[ "$COMMANDER_OUTCOME" != "success" || "$NATURAL_TRAVEL_OUTCOME" != "success" || "$FULL_SOURCE_OUTCOME" != "success" ]]; then
            echo "::error::Natural travel or strict full source story failed."
            exit 1
          fi
