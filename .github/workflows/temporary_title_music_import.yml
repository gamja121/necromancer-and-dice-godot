name: Temporary title music source import
on:
  pull_request:
    paths:
      - ".github/workflows/temporary_title_music_import.yml"
      - "title.gd"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-music:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/title-audio-parity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/title-audio-parity
          persist-credentials: true
      - name: Import exact fixed-web title song into native Godot project
        shell: bash
        run: |
          set -euo pipefail
          target=assets/title/music/title-theme.mp3
          expected=68fa42d386482ee03e3b743cc510d89e94784415
          if [ -f "$target" ]; then
            test "$(git hash-object "$target")" = "$expected"
            echo "Original title theme already imported correctly."
            exit 0
          fi
          mkdir -p "$(dirname "$target")"
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/gamja121/necromancer-dice-board/e13d5149fcecc802e5d626f3bef6e5daecd3d66c/assets/title/title-theme.mp3" \
            --output "$target"
          test "$(git hash-object "$target")" = "$expected"
          test "$(wc -c < "$target")" -eq 816970
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$target"
          git commit -m "assets(title): import exact fixed-web original title theme"
          git push origin HEAD:feat/title-audio-parity
