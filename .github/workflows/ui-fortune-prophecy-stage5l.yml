name: Frozen Web Fortune Prophecy UI Stage 5L
on:
  push:
    branches:
      - feature/ui-parity-fortune-prophecy-stage5l-20261011
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fortune-source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Godot import and parse source fortune crystal
        shell: bash
        run: |
          set -euo pipefail
          timeout 145s godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|SHADER ERROR' import.log; then exit 1; fi
      - name: Live fortune button, crystal, roll, saved face and reload
        shell: bash
        run: |
          set -euo pipefail
          timeout 125s godot --headless --path . --script res://scripts/test_ui_fortune_prophecy_stage5l.gd 2>&1 | tee fortune.log
          grep -E 'UI_FORTUNE_PROPHECY_PARITY: [0-9]+ passed, 0 failed' fortune.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|SHADER ERROR|FAIL ui-fortune:' fortune.log; then exit 1; fi
      - name: P4 map arrivals and save-resume
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s godot --headless --path . --script res://scripts/test_p4_map_move_location_integration.gd 2>&1 | tee map.log
          grep -E 'P4_MAP_LOCATION_INTEGRATION: [0-9]+ passed, 0 failed' map.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-map-location:' map.log; then exit 1; fi
      - name: Original map cloud fog regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 140s godot --headless --path . --script res://scripts/test_ui_map_cloud_fog_stage5j.gd 2>&1 | tee fog.log
          grep -E 'UI_CLOUD_FOG_PARITY: [0-9]+ passed, 0 failed' fog.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL ui-cloud-fog:' fog.log; then exit 1; fi
      - name: Real treasure, house return and new lap regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 270s godot --headless --path . --script res://scripts/test_p4_reward_home_lap_integration.gd 2>&1 | tee home.log
          grep -E 'P4_REWARD_HOME_LAP_INTEGRATION: [0-9]+ passed, 0 failed' home.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-reward-home:' home.log; then exit 1; fi
      - name: Full expedition and reward E2E regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 310s godot --headless --path . --script res://scripts/test_p4_single_run_end_to_end.gd 2>&1 | tee e2e.log
          grep -E 'P4_SINGLE_RUN_END_TO_END: [0-9]+ passed, 0 failed' e2e.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-single-run:' e2e.log; then exit 1; fi
