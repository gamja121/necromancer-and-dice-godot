name: Final Dragon Stats and Dual Existing Passives
on:
  push:
    branches:
      - main
      - feat/dragon-final-boss-dual-passive-20261022
      - fix/boss-contamination-80-no-lap-20261022
      - fix/final-story-required-for-boss-20261022
    paths:
      - "data/units.json"
      - "systems/run_session.gd"
      - "systems/map_state.gd"
      - "systems/final_boss_story_gate.gd"
      - "scripts/boss_story_test_fixture.gd"
      - "scripts/test_p4_full_source_story_chain.gd"
      - "scripts/test_map_shuffle_boss_threshold.gd"
      - "systems/battle_rules.gd"
      - "systems/unit_info.gd"
      - "systems/encounter_generator.gd"
      - "scripts/test_final_dragon_boss_stats.gd"
      - "scripts/test_web_unit_catalog_parity.gd"
      - ".github/workflows/final-dragon-stats.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dragon-boss:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import Godot project and validate scripts
        shell: bash
        run: |
          set -euo pipefail
          timeout 170s godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' import.log; then exit 1; fi
      - name: Dragon contamination-80 gate, exact stats, two passives and capture
        shell: bash
        run: |
          set -euo pipefail
          timeout 140s godot --headless --path . --script res://scripts/test_final_dragon_boss_stats.gd 2>&1 | tee dragon.log
          grep -E 'FINAL_DRAGON_BOSS: [0-9]+ passed, 0 failed' dragon.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL final-dragon:' dragon.log; then exit 1; fi
      - name: Boss threshold 79/80, purification and old-save restoration
        shell: bash
        run: |
          set -euo pipefail
          timeout 140s godot --headless --path . --script res://scripts/test_map_shuffle_boss_threshold.gd 2>&1 | tee threshold.log
          grep -E 'MAP_SHUFFLE_BOSS_THRESHOLD: [0-9]+ passed, 0 failed' threshold.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL boss-threshold:' threshold.log; then exit 1; fi
      - name: Existing 46-monster source and reward catalog stays unchanged
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s godot --headless --path . --script res://scripts/test_web_unit_catalog_parity.gd 2>&1 | tee catalog.log
          grep -E 'WEB_UNIT_CATALOG_PARITY_REGRESSION: [0-9]+ passed, 0 failed' catalog.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL web-catalog:' catalog.log; then exit 1; fi
      - name: Full original final story through actual UI and last Finish
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s godot --headless --path . --script res://scripts/test_p4_full_source_story_chain.gd 2>&1 | tee full-story.log
          grep -E 'P4_FULL_SOURCE_STORY_CHAIN: [0-9]+ passed, 0 failed' full-story.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-full' full-story.log; then exit 1; fi
      - name: Ordinary enemy capture stays unchanged
        shell: bash
        run: |
          set -euo pipefail
          timeout 140s godot --headless --path . --script res://scripts/test_capture_brand_identity.gd 2>&1 | tee capture.log
          grep -E 'CAPTURE_BRAND_IDENTITY: [0-9]+ passed, 0 failed' capture.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL capture-identity:' capture.log; then exit 1; fi
