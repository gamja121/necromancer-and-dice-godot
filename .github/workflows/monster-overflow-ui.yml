name: Monster Overflow UI (Godot)

on:
  pull_request:
    paths:
      - "systems/reward_overflow.gd"
      - "scripts/test_ui_deck_overflow_parity.gd"
      - ".github/workflows/monster-overflow-ui.yml"
  push:
    branches: [main]
    paths:
      - "systems/reward_overflow.gd"
      - "scripts/test_ui_deck_overflow_parity.gd"
      - ".github/workflows/monster-overflow-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  monster-overflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Godot project
        uses: actions/checkout@v4
      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project and detect parser errors
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee monster-overflow-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' monster-overflow-import.log; then exit 1; fi
      - name: Test deck and approved monster/dice overflow workflows
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 240s godot --headless --path . --script res://scripts/test_ui_deck_overflow_parity.gd 2>&1 | tee monster-overflow-ui.log
          grep -E '^UI_DECK_OVERFLOW_PARITY: [0-9]+ passed, 0 failed$' monster-overflow-ui.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|Invalid call|^FAIL ui-deck-overflow:' monster-overflow-ui.log; then exit 1; fi
