name: Fortune Prophecy Shared Die Foreground
on:
  pull_request:
    paths:
      - "map.gd"
      - "systems/place_actions.gd"
      - "systems/prophecy_ink_effect.gd"
      - "scripts/test_fortune_direct_flow.gd"
      - "scripts/test_fortune_direct_capture.gd"
      - "systems/exploration_actions.gd"
      - "scripts/test_ui_world_tree_shared_die.gd"
      - "scripts/test_location_die_layer_stack.gd"
      - "scripts/test_ui_fortune_prophecy_stage5l.gd"
      - ".github/workflows/fortune-prophecy-shared-die.yml"
  push:
    branches: [main]
    paths:
      - "map.gd"
      - "systems/place_actions.gd"
      - "systems/prophecy_ink_effect.gd"
      - "scripts/test_fortune_direct_flow.gd"
      - "scripts/test_fortune_direct_capture.gd"
      - "systems/exploration_actions.gd"
      - "scripts/test_ui_world_tree_shared_die.gd"
      - "scripts/test_location_die_layer_stack.gd"
      - "scripts/test_ui_fortune_prophecy_stage5l.gd"
      - ".github/workflows/fortune-prophecy-shared-die.yml"
permissions:
  contents: read
jobs:
  fortune-die:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import and parse original Godot source
        shell: bash
        run: |
          set -euo pipefail
          timeout 190s godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|SHADER ERROR' import.log; then exit 1; fi
      - name: Original location paintings and fortune interactive foreground die
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s godot --headless --path . --script res://scripts/test_location_die_layer_stack.gd 2>&1 | tee location.log
          grep -E 'LOCATION_DIE_LAYER_STACK: [0-9]+ passed, 0 failed' location.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL location-layer-stack:' location.log; then exit 1; fi
      - name: Real fortune click roll original art and durable once-only outcome
        shell: bash
        run: |
          set -euo pipefail
          timeout 140s godot --headless --path . --script res://scripts/test_ui_fortune_prophecy_stage5l.gd 2>&1 | tee fortune.log
          grep -E 'UI_FORTUNE_PROPHECY_PARITY: [0-9]+ passed, 0 failed' fortune.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL ui-fortune:' fortune.log; then exit 1; fi
      - name: Direct prophecy six faces rollback interruption and real map arrival
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s godot --headless --path . --script res://scripts/test_fortune_direct_flow.gd 2>&1 | tee direct.log
          grep -E '^FORTUNE_DIRECT_FLOW: [0-9]+ passed, 0 failed$' direct.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB.*leaked|^FAIL fortune-direct:' direct.log; then exit 1; fi
      - name: Native direct prophecy and actual exit pointer click
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a -s '-screen 0 1600x900x24' godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 30 --script res://scripts/test_fortune_direct_capture.gd 2>&1 | tee capture.log
          grep -E '^FORTUNE_DIRECT_CAPTURE: [0-9]+ passed, 0 failed$' capture.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB.*leaked|^FAIL fortune-direct:' capture.log; then exit 1; fi
          test -s prophecy_01_ready.png
          test -s prophecy_04_grand_result.png
          test -s prophecy_07_curse_result.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prophecy-direct-native
          path: prophecy_*.png
          if-no-files-found: warn
      - name: Shared world-tree prayer die with no duplicate button and persistent one-time result
        shell: bash
        run: |
          set -euo pipefail
          timeout 140s godot --headless --path . --script res://scripts/test_ui_world_tree_shared_die.gd 2>&1 | tee prayer.log
          grep -E 'WORLD_TREE_SHARED_DIE: [0-9]+ passed, 0 failed' prayer.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL prayer-die:' prayer.log; then exit 1; fi
      - name: Collision wall and battle button unchanged
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s godot --headless --path . --script res://scripts/test_shared_die_safety.gd 2>&1 | tee die.log
          grep -E 'SHARED_DIE_SAFETY: [0-9]+ passed, 0 failed' die.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL shared-die-safety:' die.log; then exit 1; fi
