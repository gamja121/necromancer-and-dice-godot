name: Inventory Touch Inspection Safety
on:
  pull_request:
    paths:
      - "systems/inventory_panel.gd"
      - "scripts/test_inventory_touch_inspection.gd"
      - ".github/workflows/inventory-touch-inspection.yml"
  push:
    branches: [main]
    paths:
      - "systems/inventory_panel.gd"
      - "scripts/test_inventory_touch_inspection.gd"
      - ".github/workflows/inventory-touch-inspection.yml"
permissions:
  contents: read
jobs:
  inventory-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Parse project resources and scripts
        run: |
          set -euo pipefail
          timeout 190s godot --headless --path . --editor --quit 2>&1 | tee parse.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|SHADER ERROR' parse.log; then exit 1; fi
      - name: Real inventory tap inspection and no-consumption regression
        run: |
          set -euo pipefail
          timeout 130s godot --headless --path . --script res://scripts/test_inventory_touch_inspection.gd 2>&1 | tee inventory.log
          grep -E 'INVENTORY_TOUCH_INSPECTION: [0-9]+ passed, 0 failed' inventory.log
          if grep -E 'SCRIPT ERROR|Parse Error|FAIL inventory-inspection:' inventory.log; then exit 1; fi
      - name: Deck selection and capacity overflow remain unchanged
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path . --script res://scripts/test_ui_deck_overflow_parity.gd 2>&1 | tee overflow.log
          grep -E 'UI_DECK_OVERFLOW_PARITY: [0-9]+ passed, 0 failed' overflow.log
          if grep -E 'SCRIPT ERROR|Parse Error|FAIL ui-deck-overflow:' overflow.log; then exit 1; fi
