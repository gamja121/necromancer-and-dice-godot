permissions:
  contents: read

# Latest-commit-wins per branch/PR. Older same-workflow runs cannot waste
# Godot imports after a newer revision supersedes them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  balance-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Run 2000 battles independently of story regressions
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_battle_balance_simulation.gd 2>&1 | tee battle-balance.log
          godot --headless --path . --script res://scripts/test_expedition_60_laps.gd 2>&1 | tee expedition-60-laps.log
          godot --headless --path . --script res://scripts/test_boss_real_encounter_simulation.gd 2>&1 | tee boss-encounter.log
          godot --headless --path . --script res://scripts/test_natural_run_survival_baseline.gd 2>&1 | tee natural-survival.log
          grep -F 'BALANCE trials=2000' battle-balance.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|BALANCE ERROR' battle-balance.log; then exit 1; fi
      - name: Upload battle simulation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-balance-log
          path: battle-balance.log
          if-no-files-found: ignore

  story-state-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' import.log; then
            exit 1
          fi
      - name: P4-03A restart every saved child and portal narrative beat
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s godot --headless --path . --script res://scripts/test_p4_story_ui_interruption.gd 2>&1 | tee p4-story-ui-interruption.log
          grep -E 'P4_STORY_UI_INTERRUPTION: [0-9]+ passed, 0 failed' p4-story-ui-interruption.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-story-resume:' p4-story-ui-interruption.log; then
            exit 1
          fi

      - name: P4-03B separate-process battle die action result permadeath and harvest restart
        shell: bash
        run: |
          set -euo pipefail
          phases=(win_seed win_actions win_settle win_capture win_claim win_verify loss_seed loss_actions loss_terminal loss_finish loss_verify cleanup)
          for phase in "${phases[@]}"; do
            echo "::group::P4-03B process phase ${phase}"
            timeout --signal=TERM --kill-after=5s 90s godot --headless --path . --script res://scripts/test_p4_combat_process_restart.gd -- "${phase}" 2>&1 | tee "p4-combat-restart-${phase}.log"
            grep -E "P4_COMBAT_PROCESS_RESTART_${phase}: [0-9]+ passed, 0 failed" "p4-combat-restart-${phase}.log"
            if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-combat-restart:' "p4-combat-restart-${phase}.log"; then
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: P4-03C separate-process map movement treasure and story outcome restart
        shell: bash
        run: |
          set -euo pipefail
          phases=(move_seed move_resume move_verify chest_seed chest_choose chest_prepare chest_claim chest_verify story_seed story_action story_commit story_ack story_verify cleanup)
          for phase in "${phases[@]}"; do
            echo "::group::P4-03C process phase ${phase}"
            timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://scripts/test_p4_three_process_restart.gd -- "${phase}" 2>&1 | tee "p4-three-process-${phase}.log"
            grep -E "P4_THREE_PROCESS_RESTART_${phase}: [0-9]+ passed, 0 failed" "p4-three-process-${phase}.log"
            if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-three-restarts:' "p4-three-process-${phase}.log"; then
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: P4-02E-A natural untouched map die graveyard rescue and village rumor
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 300s godot --headless --path . --script res://scripts/test_p4_natural_story_arrival.gd 2>&1 | tee p4-natural-story.log
          grep -E 'P4_NATURAL_STORY_ARRIVAL: [0-9]+ passed, 0 failed' p4-natural-story.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-natural:' p4-natural-story.log; then
            exit 1
          fi

      - name: P4-02D entire original child-rescue-to-king storyline and abandonment gate
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 420s godot --headless --path . --script res://scripts/test_p4_full_source_story_chain.gd 2>&1 | tee p4-full-story-chain.log
          grep -E 'P4_FULL_SOURCE_STORY_CHAIN: [0-9]+ passed, 0 failed' p4-full-story-chain.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-chain:' p4-full-story-chain.log; then
            exit 1
          fi

      - name: P4-02C portal real dice intervention victory defeat revival and hunter continuation
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 240s godot --headless --path . --script res://scripts/test_p4_ritual_portal_live_integration.gd 2>&1 | tee p4-portal-live.log
          grep -E 'P4_RITUAL_PORTAL_LIVE_INTEGRATION: [0-9]+ passed, 0 failed' p4-portal-live.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-portal:' p4-portal-live.log; then
            exit 1
          fi

      - name: P4-02B real cultist altar pass fight victory defeat retry and quest handoff
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 240s godot --headless --path . --script res://scripts/test_p4_cultist_altar_branch_integration.gd 2>&1 | tee p4-altar-branches.log
          grep -E 'P4_CULTIST_ALTAR_BRANCH_INTEGRATION: [0-9]+ passed, 0 failed' p4-altar-branches.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-altar:' p4-altar-branches.log; then
            exit 1
          fi

      - name: P4-02A real graveyard child leave rescue loss and retry UI integration
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 200s godot --headless --path . --script res://scripts/test_p4_graveyard_branch_integration.gd 2>&1 | tee p4-graveyard-branches.log
          grep -E 'P4_GRAVEYARD_BRANCH_INTEGRATION: [0-9]+ passed, 0 failed' p4-graveyard-branches.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-graveyard:' p4-graveyard-branches.log; then
            exit 1
          fi

      - name: P4-01 step 5 single persistent run Title Intro battle capture treasure home and next lap
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 220s godot --headless --path . --script res://scripts/test_p4_single_run_end_to_end.gd 2>&1 | tee p4-single-run.log
          grep -E 'P4_SINGLE_RUN_END_TO_END: [0-9]+ passed, 0 failed' p4-single-run.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-single-run:' p4-single-run.log; then
            exit 1
          fi

      - name: P4-01 step 4 real treasure rewards home recovery and next lap integration
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s godot --headless --path . --script res://scripts/test_p4_reward_home_lap_integration.gd 2>&1 | tee p4-reward-home-lap.log
          grep -E 'P4_REWARD_HOME_LAP_INTEGRATION: [0-9]+ passed, 0 failed' p4-reward-home-lap.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-reward-home:' p4-reward-home-lap.log; then
            exit 1
          fi

      - name: P4-01 step 3 deck selection embedded battle win defeat capture and map return integration
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s godot --headless --path . --script res://scripts/test_p4_combat_map_return_integration.gd 2>&1 | tee p4-combat-return.log
          grep -E 'P4_COMBAT_MAP_RETURN_INTEGRATION: [0-9]+ passed, 0 failed' p4-combat-return.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-combat:' p4-combat-return.log; then
            exit 1
          fi

      - name: P4-01 step 2 real dice movement and saved location arrival integration
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 100s godot --headless --path . --script res://scripts/test_p4_map_move_location_integration.gd 2>&1 | tee p4-map-location.log
          grep -E 'P4_MAP_LOCATION_INTEGRATION: [0-9]+ passed, 0 failed' p4-map-location.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-map-location:' p4-map-location.log; then
            exit 1
          fi

      - name: P4-01 step 1 full Title New Run Intro 12 beats Map and isolated save integration
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 60s godot --headless --path . --script res://scripts/test_p4_run_entry_integration.gd 2>&1 | tee p4-run-entry.log
          grep -E 'P4_RUN_ENTRY_INTEGRATION: [0-9]+ passed, 0 failed' p4-run-entry.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-entry:' p4-run-entry.log; then
            exit 1
          fi

      - name: All species real battle attack hit death motion and restored guardian-seed regression
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s godot --headless --path . --script res://scripts/test_battle_motion_parity.gd 2>&1 | tee battle-motion-parity.log
          grep -E 'BATTLE_MOTION_PARITY_REGRESSION: [0-9]+ passed, 0 failed' battle-motion-parity.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL battle-motion:' battle-motion-parity.log; then
            exit 1
          fi

      - name: P4-04A all 46 source monsters plus Dracula real card info animation attack hit death
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 300s godot --headless --path . --script res://scripts/test_p4_all_monster_presentation.gd 2>&1 | tee p4-all-monsters.log
          grep -E 'P4_ALL_MONSTER_PRESENTATION: [0-9]+ passed, 0 failed' p4-all-monsters.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-all-monsters:' p4-all-monsters.log; then
            exit 1
          fi

      - name: Fixed original title music and persisted Music SFX volume preferences regression
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 45s godot --headless --path . --script res://scripts/test_title_audio_parity.gd 2>&1 | tee title-audio-parity.log
          grep -E 'TITLE_AUDIO_PARITY_REGRESSION: [0-9]+ passed, 0 failed' title-audio-parity.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL title-audio:' title-audio-parity.log; then
            exit 1
          fi

      - name: Monster card decoration layout regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_card_decoration_layout.gd 2>&1 | tee card-decoration.log
          grep -E 'CARD_DECORATION_REGRESSION: [0-9]+ passed, 0 failed' card-decoration.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' card-decoration.log; then
            exit 1
          fi

      - name: Real card-screen and overlap integration regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_card_decoration_screens.gd 2>&1 | tee card-screen.log
          grep -E 'CARD_SCREEN_REGRESSION: [0-9]+ passed, 0 failed' card-screen.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' card-screen.log; then exit 1; fi

      - name: Render real five-screen monster card decoration preview
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run
          xvfb-run -a -s '-screen 0 1600x900x24' godot --path . --rendering-method gl_compatibility --script res://scripts/render_card_decoration_preview.gd 2>&1 | tee card-preview.log
          grep -F 'CARD_PREVIEW_SAVED:' card-preview.log
          grep -F 'CARD_PREVIEW_ALL_SCREENS: 5 rendered' card-preview.log
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for name in ("inventory","deck","altar","inheritance","battle"):
              payload = Path(f"card_preview_{name}.webp").read_bytes()
              if not payload: raise SystemExit(f"empty preview: {name}")
              print(f"CARD_PREVIEW_{name.upper()}_BASE64:", base64.b64encode(payload).decode("ascii"))
              print(f"CARD_PREVIEW_{name.upper()}_BYTES:",len(payload))
          PY

      - name: Story-state save and reload regression
        shell: bash
