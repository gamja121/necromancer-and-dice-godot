          phase() {
            local stage="$1"
            godot --headless --path . --script res://scripts/test_save_process_boundary.gd -- "$stage" 2>&1 | tee "w153-${stage}.log"
            grep -E "W153_PROCESS_PHASE_${stage}: [0-9]+ passed, 0 failed" "w153-${stage}.log"
            if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' "w153-${stage}.log"; then
              exit 1
            fi
          }
          crash_phase() {
            local stage="$1"
            set +e
            godot --headless --path . --script res://scripts/test_save_process_boundary.gd -- "$stage" > "w153-${stage}.log" 2>&1
            local code="$?"
            set -e
            cat "w153-${stage}.log"
            if [ "$code" -eq 0 ]; then
              echo "ERROR: expected process termination during ${stage} but exited successfully"
              exit 1
            fi
            if ! grep -F "W153_CRASH_" "w153-${stage}.log"; then
              echo "ERROR: no intentional termination marker for ${stage}"
              exit 1
            fi
            if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL W153' "w153-${stage}.log"; then
              exit 1
            fi
          }
          phase seed
          crash_phase crash_before_replace
          phase verify_old_commit
          crash_phase crash_after_commit
          phase verify_new_commit
          phase cleanup

