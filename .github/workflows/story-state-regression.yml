name: Story State Regression (Godot)

on:
  pull_request:
    paths:
      - "systems/run_session.gd"
      - "systems/map_state.gd"
      - "scripts/test_story_state_regression.gd"
      - "scripts/test_graveyard_event_entry.gd"
      - "scripts/test_graveyard_story_choice.gd"
      - "scripts/test_graveyard_story_combat.gd"
      - "scripts/test_graveyard_battle_return.gd"
      - "scripts/test_story_battle_contract.gd"
      - "scripts/test_story_battle_outcomes.gd"
      - "scripts/test_story_battle_resume.gd"
      - "scripts/test_village_rumor_entry.gd"
      - "scripts/test_village_rumor_beats.gd"
      - "scripts/test_knight_commander_entry.gd"
      - "scripts/test_knight_commander_dialogue.gd"
      - "scripts/test_monster_hunter_entry.gd"
      - "scripts/test_monster_hunter_dialogue.gd"
      - "scripts/test_cultist_rumor_entry.gd"
      - "systems/cultist_rumor_entry.gd"
      - "systems/monster_hunter_beats.gd"
      - "systems/monster_hunter_entry.gd"
      - "systems/knight_commander_beats.gd"
      - "systems/knight_commander_entry.gd"
      - "systems/village_rumor_beats.gd"
      - "systems/village_rumor_entry.gd"
      - "systems/story_battle_outcomes.gd"
      - "systems/story_battle_registry.gd"
      - "systems/graveyard_story_beats.gd"
      - "systems/story_event_entry.gd"
      - "map.gd"
      - ".github/workflows/story-state-regression.yml"
  push:
    branches: [main]
    paths:
      - "systems/run_session.gd"
      - "systems/map_state.gd"
      - "scripts/test_story_state_regression.gd"
      - "scripts/test_graveyard_event_entry.gd"
      - "scripts/test_graveyard_story_choice.gd"
      - "scripts/test_graveyard_story_combat.gd"
      - "scripts/test_graveyard_battle_return.gd"
      - "scripts/test_story_battle_contract.gd"
      - "scripts/test_story_battle_outcomes.gd"
      - "scripts/test_story_battle_resume.gd"
      - "scripts/test_village_rumor_entry.gd"
      - "scripts/test_village_rumor_beats.gd"
      - "scripts/test_knight_commander_entry.gd"
      - "scripts/test_knight_commander_dialogue.gd"
      - "scripts/test_monster_hunter_entry.gd"
      - "scripts/test_monster_hunter_dialogue.gd"
      - "scripts/test_cultist_rumor_entry.gd"
      - "systems/cultist_rumor_entry.gd"
      - "systems/monster_hunter_beats.gd"
      - "systems/monster_hunter_entry.gd"
      - "systems/knight_commander_beats.gd"
      - "systems/knight_commander_entry.gd"
      - "systems/village_rumor_beats.gd"
      - "systems/village_rumor_entry.gd"
      - "systems/story_battle_outcomes.gd"
      - "systems/story_battle_registry.gd"
      - "systems/graveyard_story_beats.gd"
      - "systems/story_event_entry.gd"
      - "map.gd"
      - ".github/workflows/story-state-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  story-state-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' import.log; then
            exit 1
          fi
      - name: Story-state save and reload regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_story_state_regression.gd 2>&1 | tee story-state.log
          grep -E 'STORY_STATE_REGRESSION: [0-9]+ passed, 0 failed' story-state.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' story-state.log; then
            exit 1
          fi
      - name: Graveyard first encounter and save regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_graveyard_event_entry.gd 2>&1 | tee graveyard-entry.log
          grep -E 'GRAVEYARD_ENTRY_REGRESSION: [0-9]+ passed, 0 failed' graveyard-entry.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' graveyard-entry.log; then
            exit 1
          fi

      - name: Graveyard choice and ghoul beat regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_graveyard_story_choice.gd 2>&1 | tee graveyard-choice.log
          grep -E 'GRAVEYARD_CHOICE_REGRESSION: [0-9]+ passed, 0 failed' graveyard-choice.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' graveyard-choice.log; then
            exit 1
          fi

      - name: Graveyard selected-deck ghoul battle regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_graveyard_story_combat.gd 2>&1 | tee graveyard-combat.log
          grep -E 'GRAVEYARD_COMBAT_REGRESSION: [0-9]+ passed, 0 failed' graveyard-combat.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' graveyard-combat.log; then
            exit 1
          fi

      - name: Graveyard battle outcome return and acknowledgement regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_graveyard_battle_return.gd 2>&1 | tee graveyard-return.log
          grep -E 'GRAVEYARD_RETURN_REGRESSION: [0-9]+ passed, 0 failed' graveyard-return.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' graveyard-return.log; then
            exit 1
          fi

      - name: Shared story battle contract and compatibility regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_story_battle_contract.gd 2>&1 | tee story-contract.log
          grep -E 'STORY_BATTLE_CONTRACT_REGRESSION: [0-9]+ passed, 0 failed' story-contract.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' story-contract.log; then
            exit 1
          fi

      - name: Shared story outcomes and return presentation regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_story_battle_outcomes.gd 2>&1 | tee story-outcomes.log
          grep -E 'STORY_OUTCOME_REGRESSION: [0-9]+ passed, 0 failed' story-outcomes.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' story-outcomes.log; then
            exit 1
          fi

      - name: Story battle interrupted checkpoint and return integration regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_story_battle_resume.gd 2>&1 | tee story-resume.log
          grep -E 'STORY_RESUME_REGRESSION: [0-9]+ passed, 0 failed' story-resume.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' story-resume.log; then
            exit 1
          fi

      - name: Village rumor first entry and branching regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_village_rumor_entry.gd 2>&1 | tee village-rumor-entry.log
          grep -E 'VILLAGE_RUMOR_ENTRY_REGRESSION: [0-9]+ passed, 0 failed' village-rumor-entry.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' village-rumor-entry.log; then
            exit 1
          fi

      - name: Village rumor full dialogue, layers and completion regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_village_rumor_beats.gd 2>&1 | tee village-rumor-beats.log
          grep -E 'VILLAGE_RUMOR_BEATS_REGRESSION: [0-9]+ passed, 0 failed' village-rumor-beats.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' village-rumor-beats.log; then
            exit 1
          fi

      - name: Knight commander first encounter prerequisite and save regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_knight_commander_entry.gd 2>&1 | tee knight-commander-entry.log
          grep -E 'KNIGHT_COMMANDER_ENTRY_REGRESSION: [0-9]+ passed, 0 failed' knight-commander-entry.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' knight-commander-entry.log; then
            exit 1
          fi

      - name: Knight commander full dialogue and quest acceptance regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_knight_commander_dialogue.gd 2>&1 | tee knight-dialogue.log
          grep -E 'KNIGHT_COMMANDER_DIALOGUE_REGRESSION: [0-9]+ passed, 0 failed' knight-dialogue.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' knight-dialogue.log; then
            exit 1
          fi

      - name: Monster hunter first world-tree encounter prerequisite and save regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_monster_hunter_entry.gd 2>&1 | tee monster-hunter-entry.log
          grep -E 'MONSTER_HUNTER_ENTRY_REGRESSION: [0-9]+ passed, 0 failed' monster-hunter-entry.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' monster-hunter-entry.log; then
            exit 1
          fi

      - name: Monster hunter full dialogue, clues and quest completion regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_monster_hunter_dialogue.gd 2>&1 | tee monster-hunter-dialogue.log
          grep -E 'MONSTER_HUNTER_DIALOGUE_REGRESSION: [0-9]+ passed, 0 failed' monster-hunter-dialogue.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' monster-hunter-dialogue.log; then
            exit 1
          fi

      - name: Cultist rumor first-night scene and hunter-clue prerequisite regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_cultist_rumor_entry.gd 2>&1 | tee cultist-rumor-entry.log
          grep -E 'CULTIST_RUMOR_ENTRY_REGRESSION: [0-9]+ passed, 0 failed' cultist-rumor-entry.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' cultist-rumor-entry.log; then
            exit 1
          fi
