name: Build and Deploy Godot Web

on:
  push:
    branches: [main]
    paths:
      - "**/*.gd"
      - "**/*.tscn"
      - "**/*.tres"
      - "project.godot"
      - "export_presets.cfg"
      - "assets/**"
      - "data/**"
      - "web/**"
      - ".github/workflows/web-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: godot-pages-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' import.log; then
            exit 1
          fi

      - name: Startup check
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 120 2>&1 | tee runtime.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' runtime.log; then
            exit 1
          fi

      - name: Export Web
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/web
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee export.log
          test -s build/web/index.html
          test -s build/web/index.pck
          test -s build/web/index.wasm

      - name: Add mobile landscape shell
        shell: bash
        run: |
          set -euo pipefail
          cp web/landscape-lock.css build/web/landscape-lock.css
          cp web/landscape-lock.js build/web/landscape-lock.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/web/index.html")
          s = p.read_text(encoding="utf-8")
          css = '<link rel="stylesheet" href="landscape-lock.css">'
          js = '<script src="landscape-lock.js" defer></script>'
          if css not in s:
              s = s.replace("</head>", f"  {css}\n</head>")
          if js not in s:
              s = s.replace("</body>", f"  {js}\n</body>")
          p.write_text(s, encoding="utf-8")
          PY
          printf '%s\n' "$GITHUB_SHA" > build/web/DEPLOYED_SOURCE_SHA.txt
          touch build/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
