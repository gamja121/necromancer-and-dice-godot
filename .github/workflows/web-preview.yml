name: Build and Publish Godot Web

on:
  push:
    branches: [main]
    paths:
      - "**/*.gd"
      - "**/*.tscn"
      - "**/*.tres"
      - "project.godot"
      - "export_presets.cfg"
      - "assets/**"
      - "data/**"
      - "web/**"
      - ".github/workflows/web-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-web-main
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Godot source
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' import.log; then
            exit 1
          fi

      - name: Startup check
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 120 2>&1 | tee runtime.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' runtime.log; then
            exit 1
          fi

      - name: Export Web
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/web
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee export.log
          test -s build/web/index.html
          test -s build/web/index.pck
          test -s build/web/index.wasm

      - name: Prepare phone preview
        shell: bash
        run: |
          set -euo pipefail
          cp web/landscape-lock.css build/web/landscape-lock.css
          cp web/landscape-lock.js build/web/landscape-lock.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/web/index.html")
          s = p.read_text(encoding="utf-8")
          css = '<link rel="stylesheet" href="landscape-lock.css">'
          js = '<script src="landscape-lock.js" defer></script>'
          if css not in s:
              s = s.replace("</head>", f"  {css}\n</head>")
          if js not in s:
              s = s.replace("</body>", f"  {js}\n</body>")
          p.write_text(s, encoding="utf-8")
          PY
          printf '%s\n' "$GITHUB_SHA" > build/web/SOURCE_SHA.txt
          cp build/web/SOURCE_SHA.txt build/web/DEPLOYED_SOURCE_SHA.txt
          touch build/web/.nojekyll

      - name: Checkout public preview host
        uses: actions/checkout@v4
        with:
          repository: gamja121/necromancer-dice-board
          ref: main
          path: public_deploy
          ssh-key: ${{ secrets.GODOT_WEB_DEPLOY_KEY }}

      - name: Replace preview with this Godot build
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest" != "$SOURCE_SHA" ]; then
            echo "A newer source revision exists; skipping stale publication."
            exit 0
          fi
          for file in index.html index.pck index.wasm SOURCE_SHA.txt DEPLOYED_SOURCE_SHA.txt; do
            test -s "build/web/$file"
          done
          rsync -a --delete             --exclude='.git/'             --exclude='.github/'             --exclude='README.md'             build/web/ public_deploy/
          cd public_deploy
          git config user.name "godot-web-deploy"
          git config user.email "godot-web-deploy@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Latest Godot Web build is already published."
            exit 0
          fi
          git commit -m "Deploy Godot Web from ${SOURCE_SHA}"
          git push origin HEAD:main
