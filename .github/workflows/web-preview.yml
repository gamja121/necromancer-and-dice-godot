name: Build and Publish Godot Web

on:
  push:
    branches:
      - main
    paths:
      - "**/*.gd"
      - "**/*.tscn"
      - "**/*.tres"
      - "project.godot"
      - "export_presets.cfg"
      - "assets/**"
      - "data/**"
      - ".github/workflows/web-preview.yml"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' import.log; then
            echo "Godot import found an error."
            exit 1
          fi

      - name: Check game startup
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 120 2>&1 | tee runtime.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' runtime.log; then
            echo "Godot startup found an error."
            exit 1
          fi

      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee export.log
          test -s build/web/index.html
          test -n "$(find build/web -maxdepth 1 -type f -name '*.wasm' -print -quit)"
          test -n "$(find build/web -maxdepth 1 -type f -name '*.pck' -print -quit)"

      - name: Inject mobile landscape shell
        shell: bash
        run: |
          set -euo pipefail
          cp assets/fonts/OFL.txt build/web/FONT_LICENSE.txt
          cp web/landscape-lock.css build/web/landscape-lock.css
          cp web/landscape-lock.js build/web/landscape-lock.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path("build/web/index.html")
          text = path.read_text(encoding="utf-8")
          css = '<link rel="stylesheet" href="landscape-lock.css">'
          js = '<script src="landscape-lock.js" defer></script>'
          if css not in text:
              text = text.replace("</head>", f"  {css}\n</head>")
          if js not in text:
              text = text.replace("</body>", f"  {js}\n</body>")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Record source revision
        shell: bash
        run: |
          printf '%s\n' "${GITHUB_SHA}" > build/web/SOURCE_SHA.txt
          cp build/web/SOURCE_SHA.txt build/web/DEPLOYED_SOURCE_SHA.txt
          touch build/web/.nojekyll

      - name: Upload canonical web artifact
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-and-dice-web
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Checkout public deployment repository
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          repository: gamja121/necromancer-dice-board
          ref: main
          path: public_deploy
          ssh-key: ${{ secrets.GODOT_WEB_DEPLOY_KEY }}

      - name: Publish successful build to canonical public repository
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest" != "$SOURCE_SHA" ]; then
            echo "A newer source revision exists; skipping stale publication."
            exit 0
          fi
          for file in index.html index.pck index.wasm; do
            test -s "build/web/$file"
          done
          test "$(cat build/web/SOURCE_SHA.txt)" = "$SOURCE_SHA"
          test "$(cat build/web/DEPLOYED_SOURCE_SHA.txt)" = "$SOURCE_SHA"
          if find build/web -type f -size +100M | grep -q .; then
            echo "An export file exceeds GitHub's per-file limit."
            exit 1
          fi
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='README.md' build/web/ public_deploy/
          cd public_deploy
          git config user.name "godot-web-deploy"
          git config user.email "godot-web-deploy@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "This source build is already published."
            exit 0
          fi
          git commit -m "Deploy Godot Web from ${SOURCE_SHA}"
          git push origin HEAD:main
