name: Build Godot Web Artifact

on:
  push:
    branches:
      - main
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "project.godot"
      - "export_presets.cfg"
      - "assets/**"
      - "data/**"
      - ".github/workflows/web-preview.yml"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' import.log; then
            echo "Godot import found an error."
            exit 1
          fi

      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee export.log
          test -s build/web/index.html
          test -n "$(find build/web -maxdepth 1 -type f -name '*.wasm' -print -quit)"
          test -n "$(find build/web -maxdepth 1 -type f -name '*.pck' -print -quit)"

      - name: Inject mobile landscape shell
        shell: bash
        run: |
          set -euo pipefail
          cp web/landscape-lock.css build/web/landscape-lock.css
          cp web/landscape-lock.js build/web/landscape-lock.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path("build/web/index.html")
          text = path.read_text(encoding="utf-8")
          css = '<link rel="stylesheet" href="landscape-lock.css">'
          js = '<script src="landscape-lock.js" defer></script>'
          if css not in text:
              text = text.replace("</head>", f"  {css}\n</head>")
          if js not in text:
              text = text.replace("</body>", f"  {js}\n</body>")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Record source revision
        shell: bash
        run: |
          printf '%s\n' "${GITHUB_SHA}" > build/web/SOURCE_SHA.txt

      - name: Upload canonical web artifact
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-and-dice-web
          path: build/web
          if-no-files-found: error
          retention-days: 14
