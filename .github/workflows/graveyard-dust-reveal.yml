name: Graveyard Soil Reveal and Explicit Collection
on:
  pull_request:
    paths:
      - "map.gd"
      - "systems/exploration_actions.gd"
      - "systems/graveyard_reward_motion.gd"
      - "systems/location_notice_strip.gd"
      - "systems/place_actions.gd"
      - "scripts/test_graveyard_dust_reveal.gd"
      - "scripts/test_graveyard_extraction_exit.gd"
      - "scripts/test_ui_graveyard_event_parity.gd"
      - ".github/workflows/graveyard-dust-reveal.yml"
  push:
    branches: [main]
    paths:
      - "map.gd"
      - "systems/exploration_actions.gd"
      - "systems/graveyard_reward_motion.gd"
      - "systems/location_notice_strip.gd"
      - "systems/place_actions.gd"
      - "scripts/test_graveyard_dust_reveal.gd"
      - "scripts/test_graveyard_extraction_exit.gd"
      - "scripts/test_ui_graveyard_event_parity.gd"
      - ".github/workflows/graveyard-dust-reveal.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  graveyard-reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import and parse preserved original assets
        shell: bash
        run: |
          set -euo pipefail
          timeout 200s godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:|ObjectDB.*leaked' import.log; then exit 1; fi
      - name: Saved reveal, explicit collect, overflow resume and original UI geometry
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s godot --headless --path . --script res://scripts/test_graveyard_dust_reveal.gd 2>&1 | tee reveal.log
          grep -E '^GRAVEYARD_DUST_REVEAL: [0-9]+ passed, 0 failed$' reveal.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|Failed loading resource|ERROR:|ObjectDB.*leaked|^FAIL graveyard-reveal:' reveal.log; then exit 1; fi
      - name: Existing backend reward, once-visit, save rollback and UI regressions
        shell: bash
        run: |
          set -euo pipefail
          for name in test_graveyard_random_dice test_graveyard_extraction_exit test_ui_graveyard_event_parity test_ui_fortune_prophecy_stage5l; do
            timeout 180s godot --headless --path . --script "res://scripts/$name.gd" 2>&1 | tee "$name.log"
            grep -E '[0-9]+ passed, 0 failed' "$name.log"
            if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|Failed loading resource|ERROR:|ObjectDB.*leaked|^FAIL ' "$name.log"; then exit 1; fi
          done
      - name: Check whitespace
        run: git diff --check
