name: Map Shuffle Branch Checks

on:
  push:
    branches:
      - feature/map-tile-counter-rotation-20261011
      - feature/map-shuffle-depth-landing-20261011
      - feature/map-shuffle-mobile-polish-20261011
      - feature/map-shuffle-dice-aura-20261011
      - feature/map-shuffle-audio-20261011
      - feature/map-shuffle-audio-timing-20261011
      - feature/map-shuffle-final-qa-20261011
      - feature/stone-shuffle-landing-20261011
      - feature/stone-shuffle-departure-20261011
      - feature/stone-shuffle-rotation-inertia-20261011
      - feature/stone-shuffle-dust-impact-20261011
      - feature/stone-shuffle-audio-weight-20261011
      - feature/stone-shuffle-final-qa-20261011
      - feature/boss-tile-contamination-20-20261011
      - feature/boss-tile-preserve-step3-20261011
      - feature/boss-roster-tiers-tile-grades-20261011
      - feature/boss-tier-combat-verification-20261011
    paths:
      - "systems/map_shuffle_*.gd"
      - "map.gd"
      - "systems/cultist_altar_*.gd"
      - "systems/run_session.gd"
      - "systems/boss_roster.gd"
      - "systems/map_state.gd"
      - "scripts/test_boss_roster_rules.gd"
      - "systems/encounter_generator.gd"
      - "systems/battle_rules.gd"
      - "systems/story_battle_registry.gd"
      - "scripts/test_map_shuffle_*.gd"
      - ".github/workflows/map-shuffle-branch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map-shuffle-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' import.log; then exit 1; fi
      - name: Ring geometry regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_map_shuffle_layout.gd 2>&1 | tee layout.log
          grep -E 'MAP_SHUFFLE_LAYOUT: [0-9]+ passed, 0 failed' layout.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' layout.log; then exit 1; fi
      - name: Gather animation regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_map_shuffle_gather.gd 2>&1 | tee gather.log
          grep -E 'MAP_SHUFFLE_GATHER: [0-9]+ passed, 0 failed' gather.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' gather.log; then exit 1; fi
      - name: Counter-rotation animation regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_map_shuffle_rotation.gd 2>&1 | tee rotation.log
          grep -E 'MAP_SHUFFLE_ROTATION: [0-9]+ passed, 0 failed' rotation.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' rotation.log; then exit 1; fi
      - name: Scatter, reveal and save-failure regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://scripts/test_map_shuffle_scatter.gd 2>&1 | tee scatter.log
          grep -E 'MAP_SHUFFLE_SCATTER: [0-9]+ passed, 0 failed' scatter.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' scatter.log; then exit 1; fi
      - name: Real home exit transition and failed disk save
        shell: bash
        run: |
          set -euo pipefail
          timeout 65s godot --headless --path . --script res://scripts/test_map_shuffle_home_exit.gd 2>&1 | tee home-exit.log
          grep -E 'MAP_SHUFFLE_HOME_EXIT: [0-9]+ passed, 0 failed' home-exit.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' home-exit.log; then exit 1; fi
      - name: 2.5D shadow and landing regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path . --script res://scripts/test_map_shuffle_depth.gd 2>&1 | tee depth.log
          grep -E 'MAP_SHUFFLE_DEPTH: [0-9]+ passed, 0 failed' depth.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' depth.log; then exit 1; fi
      - name: Mobile landscape tile and shadow geometry
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path . --script res://scripts/test_map_shuffle_mobile.gd 2>&1 | tee mobile.log
          grep -E 'MAP_SHUFFLE_MOBILE: [0-9]+ passed, 0 failed' mobile.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' mobile.log; then exit 1; fi
      - name: Dice aura timing and cleanup regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path . --script res://scripts/test_map_shuffle_dice_aura.gd 2>&1 | tee dice-aura.log
          grep -E 'MAP_SHUFFLE_DICE_AURA: [0-9]+ passed, 0 failed' dice-aura.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' dice-aura.log; then exit 1; fi
      - name: Shuffle phase sound and mute regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path . --script res://scripts/test_map_shuffle_sfx.gd 2>&1 | tee sfx.log
          grep -E 'MAP_SHUFFLE_SFX: [0-9]+ passed, 0 failed' sfx.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' sfx.log; then exit 1; fi
      - name: Final shuffle acceptance for repeated exits and saved worlds
        shell: bash
        run: |
          set -euo pipefail
          timeout 80s godot --headless --path . --script res://scripts/test_map_shuffle_acceptance.gd 2>&1 | tee acceptance.log
          grep -E 'MAP_SHUFFLE_ACCEPTANCE: [0-9]+ passed, 0 failed' acceptance.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' acceptance.log; then exit 1; fi
      - name: Heavy stone landing and no-rebound regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path . --script res://scripts/test_map_shuffle_stone_landing.gd 2>&1 | tee stone-landing.log
          grep -E 'MAP_SHUFFLE_STONE_LANDING: [0-9]+ passed, 0 failed' stone-landing.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' stone-landing.log; then exit 1; fi
      - name: Heavy stone departure tremor and acceleration regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 70s godot --headless --path . --script res://scripts/test_map_shuffle_stone_departure.gd 2>&1 | tee stone-departure.log
          grep -E 'MAP_SHUFFLE_STONE_DEPARTURE: [0-9]+ passed, 0 failed' stone-departure.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' stone-departure.log; then exit 1; fi
      - name: Heavy stone rotation inertia and braking regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 70s godot --headless --path . --script res://scripts/test_map_shuffle_stone_rotation.gd 2>&1 | tee stone-rotation.log
          grep -E 'MAP_SHUFFLE_STONE_ROTATION: [0-9]+ passed, 0 failed' stone-rotation.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' stone-rotation.log; then exit 1; fi
      - name: Stone dust impact lifetime and failure-cleanup regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 70s godot --headless --path . --script res://scripts/test_map_shuffle_stone_dust.gd 2>&1 | tee stone-dust.log
          grep -E 'MAP_SHUFFLE_STONE_DUST: [0-9]+ passed, 0 failed' stone-dust.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' stone-dust.log; then exit 1; fi
      - name: Weighted stone sound and physical impact sync regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 80s godot --headless --path . --script res://scripts/test_map_shuffle_stone_sfx.gd 2>&1 | tee stone-sfx.log
          grep -E 'MAP_SHUFFLE_STONE_SFX: [0-9]+ passed, 0 failed' stone-sfx.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' stone-sfx.log; then exit 1; fi
      - name: Final stone-weight choreography and repeated save acceptance
        shell: bash
        run: |
          set -euo pipefail
          timeout 100s godot --headless --path . --script res://scripts/test_map_shuffle_stone_integrated.gd 2>&1 | tee stone-integrated.log
          grep -E 'MAP_SHUFFLE_STONE_INTEGRATED: [0-9]+ passed, 0 failed' stone-integrated.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' stone-integrated.log; then exit 1; fi
      - name: Boss threshold actual stone shuffle, disk reload and rollback
        shell: bash
        run: |
          set -euo pipefail
          timeout 100s godot --headless --path . --script res://scripts/test_map_shuffle_boss_integration.gd 2>&1 | tee boss-shuffle-integrated.log
          grep -E 'MAP_SHUFFLE_BOSS_INTEGRATION: [0-9]+ passed, 0 failed' boss-shuffle-integrated.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' boss-shuffle-integrated.log; then exit 1; fi

      - name: Run boss roster, tile grade, encounter and permanent clear rules
        shell: bash
        run: |
          set -euo pipefail
          timeout 95s godot --headless --path . --script res://scripts/test_boss_roster_rules.gd 2>&1 | tee boss-roster-rules.log
          grep -E 'BOSS_ROSTER_RULES: [0-9]+ passed, 0 failed' boss-roster-rules.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' boss-roster-rules.log; then exit 1; fi

      - name: Boss tile contamination 20 persistence and map UI regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . --script res://scripts/test_map_shuffle_boss_threshold.gd 2>&1 | tee boss-threshold.log
          grep -E 'MAP_SHUFFLE_BOSS_THRESHOLD: [0-9]+ passed, 0 failed' boss-threshold.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' boss-threshold.log; then exit 1; fi

      - name: Latest main P4 title-to-first-map integration
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s godot --headless --path . --script res://scripts/test_p4_run_entry_integration.gd 2>&1 | tee p4-title-run.log
          grep -E 'P4_RUN_ENTRY_INTEGRATION: [0-9]+ passed, 0 failed' p4-title-run.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-' p4-title-run.log; then exit 1; fi
      - name: Latest main P4 map movement and locations integration
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s godot --headless --path . --script res://scripts/test_p4_map_move_location_integration.gd 2>&1 | tee p4-map-move.log
          grep -E 'P4_MAP_LOCATION_INTEGRATION: [0-9]+ passed, 0 failed' p4-map-move.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-' p4-map-move.log; then exit 1; fi
      - name: Latest main P4 embedded combat and map-return integration
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s godot --headless --path . --script res://scripts/test_p4_combat_map_return_integration.gd 2>&1 | tee p4-combat-return.log
          grep -E 'P4_COMBAT_MAP_RETURN_INTEGRATION: [0-9]+ passed, 0 failed' p4-combat-return.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-' p4-combat-return.log; then exit 1; fi
