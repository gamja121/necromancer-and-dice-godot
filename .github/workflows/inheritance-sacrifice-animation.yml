name: Inheritance Sacrifice Card Animation
on:
  pull_request:
    paths:
      - "systems/home_inheritance.gd"
      - "systems/inheritance_sacrifice_effect.gd"
      - "scripts/test_inheritance_sacrifice_effect.gd"
      - "scripts/test_inheritance_brand_transfer.gd"
      - ".github/workflows/inheritance-sacrifice-animation.yml"
  push:
    branches:
      - main
    paths:
      - "systems/home_inheritance.gd"
      - "systems/inheritance_sacrifice_effect.gd"
      - "scripts/test_inheritance_sacrifice_effect.gd"
      - "scripts/test_inheritance_brand_transfer.gd"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-animation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Godot import and parse
        shell: bash
        run: |
          set -euo pipefail
          timeout 160s godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' import.log; then exit 1; fi
      - name: Confirm failure rollback and donor vanish animation
        shell: bash
        run: |
          set -euo pipefail
          timeout 130s godot --headless --path . --script res://scripts/test_inheritance_sacrifice_effect.gd 2>&1 | tee sacrifice.log
          grep -E '^INHERITANCE_SACRIFICE_EFFECT: [0-9]+ passed, 0 failed' sacrifice.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|^FAIL inheritance-ash:' sacrifice.log; then exit 1; fi
      - name: Committed brand source, filtered faces and appended receiver slot
        shell: bash
        run: |
          set -euo pipefail
          timeout 160s godot --headless --path . --script res://scripts/test_inheritance_brand_transfer.gd 2>&1 | tee transfer.log
          grep -E '^INHERITANCE_BRAND_TRANSFER: [0-9]+ passed, 0 failed$' transfer.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|Failed loading resource|ERROR:|ObjectDB.*leaked|^FAIL inheritance-transfer:' transfer.log; then exit 1; fi
      - name: Unchanged existing inheritance and card UI
        shell: bash
        run: |
          set -euo pipefail
          for name in test_ui_route_inheritance_parity test_card_decoration_screens; do
            timeout 130s godot --headless --path . --script "res://scripts/$name.gd" 2>&1 | tee "$name.log"
            grep -E '[0-9]+ passed, 0 failed' "$name.log"
            if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|^FAIL ' "$name.log"; then exit 1; fi
          done
