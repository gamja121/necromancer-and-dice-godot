name: AI Task Ledger Tests
on:
  pull_request:
    paths:
      - "tools/ai_runner/**"
      - "tests/test_ai_runner_checkpoints.py"
      - ".github/workflows/**"
      - "scripts/check_ci_workflow_policy.py"
      - ".github/ISSUE_TEMPLATE/ai-development-task.yml"
  push:
    branches: [main]
    paths:
      - "tools/ai_runner/**"
      - "tests/test_ai_runner_checkpoints.py"
      - ".github/workflows/**"
      - "scripts/check_ci_workflow_policy.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p test_ai_runner_checkpoints.py -v
      - run: python3 -m compileall -q tools/ai_runner
      - name: Parse all workflow YAML files
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |path| YAML.parse_file(path) }'
      - name: Verify non-lossy regression and concurrency policy
        run: python3 scripts/check_ci_workflow_policy.py
