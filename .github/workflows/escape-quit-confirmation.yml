name: Escape Quit Confirmation
on:
  pull_request:
    paths:
      - "project.godot"
      - "systems/quit_confirmation.gd"
      - "scripts/test_quit_confirmation*.gd"
      - "data/localization/en.json"
      - ".github/workflows/escape-quit-confirmation.yml"
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "systems/quit_confirmation.gd"
      - "scripts/test_quit_confirmation*.gd"
      - "data/localization/en.json"
      - ".github/workflows/escape-quit-confirmation.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quit-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import original runtime
        shell: bash
        run: |
          set -euo pipefail
          timeout 330s godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' import.log; then exit 1; fi
      - name: Real Escape input cancel pause focus and save preservation
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s godot --headless --path . --audio-driver Dummy --script res://scripts/test_quit_confirmation.gd 2>&1 | tee quit.log
          grep -E '^QUIT_CONFIRMATION: [0-9]+ passed, 0 failed$' quit.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB.*leaked|^FAIL' quit.log; then exit 1; fi
      - name: Actual confirmed process exit
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path . --audio-driver Dummy --script res://scripts/test_quit_confirmation_exit.gd 2>&1 | tee exit.log
          grep -F 'QUIT_CONFIRMATION_EXIT: confirmed' exit.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB.*leaked' exit.log; then exit 1; fi
      - name: Native graphical confirmation over map title and settings
        shell: bash
        env:
          QUIT_CAPTURE_DIR: ${{ github.workspace }}/quit_captures
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a -s '-screen 0 1600x900x24' godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 30 --script res://scripts/test_quit_confirmation.gd 2>&1 | tee native.log
          grep -E '^QUIT_CONFIRMATION: [0-9]+ passed, 0 failed$' native.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB.*leaked|^FAIL' native.log; then exit 1; fi
          test -s quit_captures/01_map_quit.png
          test -s quit_captures/04_settings_quit.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quit-confirmation-native
          path: quit_captures/*.png
          if-no-files-found: warn
