name: Frozen Web Graveyard Dialogue Frame Stage 5P
on:
  push:
    branches:
      - feature/ui-parity-graveyard-dialogue-frame-stage5p-20261011
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graveyard-source-dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Check repaired WebP preserves every existing original byte
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct, subprocess
          raw=Path("assets/map/ui/intro-dialogue-box.webp").read_bytes()
          assert len(raw)==12330, "padded WebP length"
          assert raw[:4]==b"RIFF" and raw[8:12]==b"WEBP" and raw[12:16]==b"VP8 ", "original VP8 headers"
          assert struct.unpack_from("<I",raw,4)[0]+8==len(raw), "RIFF chunk length"
          assert struct.unpack_from("<I",raw,16)[0]+20==len(raw), "VP8 data chunk length"
          assert raw[12000:]==bytes(330), "only 330 zero bytes appended"
          prefix_sha=subprocess.run(["git","hash-object","--stdin"],input=raw[:12000],capture_output=True,check=True).stdout.decode().strip()
          assert prefix_sha=="3bab039aa347faa7546e213de941213dd8cade8d", "source prefix differs from frozen web original"
          print("WEBP_SOURCE_PREFIX: 12000 original bytes intact, 330 zero padded, original Git SHA verified")
          PY
      - name: Import reconstructed source-based graveyard dialogue texture
        shell: bash
        run: |
          set -euo pipefail
          timeout 145s godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|SHADER ERROR' import.log; then exit 1; fi
      - name: Real graveyard dialogue art, buttons, story save and resume
        shell: bash
        run: |
          set -euo pipefail
          timeout 170s godot --headless --path . --script res://scripts/test_ui_grave_dialogue_stage5p.gd 2>&1 | tee dialogue.log
          grep -E 'UI_GRAVE_DIALOGUE_FRAME_PARITY: [0-9]+ passed, 0 failed' dialogue.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL ui-grave-dialogue:' dialogue.log; then exit 1; fi
      - name: Prior graveyard illustrated story and corpse extraction
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s godot --headless --path . --script res://scripts/test_ui_graveyard_event_parity.gd 2>&1 | tee grave_ui.log
          grep -E 'UI_STAGE4_PARITY: [0-9]+ passed, 0 failed' grave_ui.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL ui-stage4:' grave_ui.log; then exit 1; fi
      - name: Interruption and process restart for child and portal narratives
        shell: bash
        run: |
          set -euo pipefail
          timeout 270s godot --headless --path . --script res://scripts/test_p4_story_ui_interruption.gd 2>&1 | tee story.log
          grep -E 'P4_STORY_UI_INTERRUPTION: [0-9]+ passed, 0 failed' story.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-story-resume:' story.log; then exit 1; fi
      - name: Real graveyard rescue and abandonment branch including combat
        shell: bash
        run: |
          set -euo pipefail
          timeout 340s godot --headless --path . --script res://scripts/test_p4_graveyard_branch_integration.gd 2>&1 | tee graveyard.log
          grep -E 'P4_GRAVEYARD_BRANCH_INTEGRATION: [0-9]+ passed, 0 failed' graveyard.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-graveyard:' graveyard.log; then exit 1; fi
      - name: Map movement and saved location regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 310s godot --headless --path . --script res://scripts/test_p4_map_move_location_integration.gd 2>&1 | tee map.log
          grep -E 'P4_MAP_LOCATION_INTEGRATION: [0-9]+ passed, 0 failed' map.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-map-location:' map.log; then exit 1; fi
      - name: Full expedition E2E regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 310s godot --headless --path . --script res://scripts/test_p4_single_run_end_to_end.gd 2>&1 | tee e2e.log
          grep -E 'P4_SINGLE_RUN_END_TO_END: [0-9]+ passed, 0 failed' e2e.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|FAIL p4-single-run:' e2e.log; then exit 1; fi
