name: Diagnostic Fortune Prophecy Original PNG Recovery
on:
  push:
    branches: [feature/ui-parity-fortune-prophecy-stage5l-20261011]
    paths: [.github/workflows/ui-fortune-asset-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decode-original:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PIL
        run: python3 -m pip install --quiet pillow
      - name: Recover and quantify original PNG pixels
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageFile
          from pathlib import Path
          import io, hashlib, base64, collections
          path=Path("assets/map/events/fortune-prophecy-ui.png")
          for allow in [False,True]:
            ImageFile.LOAD_TRUNCATED_IMAGES=allow
            try:
              img=Image.open(path)
              img.load()
              rgba=img.convert("RGBA")
              alpha=rgba.getchannel("A")
              n=len(rgba.getcolors(maxcolors=1000000) or [])
              print("FORTUNE_DECODE allow_truncated="+str(allow)+" size="+str(rgba.size)+" alpha_bbox="+str(alpha.getbbox())+" alpha_range="+str(alpha.getextrema())+" ncolors="+str(n)+" pixels_sha256="+hashlib.sha256(rgba.tobytes()).hexdigest(),flush=True)
              out=io.BytesIO()
              rgba.save(out,format="PNG",optimize=True)
              print("FORTUNE_PNG_BASE64="+base64.b64encode(out.getvalue()).decode("ascii"),flush=True)
            except Exception as err:
              print("FORTUNE_DECODE_ERROR allow_truncated="+str(allow)+" "+repr(err),flush=True)
          PY
