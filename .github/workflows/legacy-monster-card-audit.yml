name: Audit Legacy Monster Card Removal
on:
  push:
    branches:
      - audit/legacy-monster-card-cleanup-20261024
  pull_request:
    paths:
      - "assets/cards/unit-card-*"
      - ".github/workflows/legacy-monster-card-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-asset-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inventory legacy files and active references before removal
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          paths = [p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p]
          originals = sorted(p for p in paths if p.startswith('assets/cards/unit-card-'))
          print('LEGACY_ASSET_COUNT:', len(originals))
          for path in originals:
              print('LEGACY_FILE:', path)
          imports = [p for p in originals if p.endswith('.import')]
          uids = {}
          for imp in imports:
              txt = pathlib.Path(imp).read_text(encoding='utf-8',errors='replace')
              match = re.search(r'(?m)^uid="(uid://[^"]+)"',txt)
              if match:
                  uids[match.group(1)] = imp
          print('LEGACY_UID_COUNT:',len(uids))
          ext = {'.gd','.tscn','.tres','.godot','.cfg','.json','.yml','.yaml','.xml','.html','.js','.ts','.css','.py','.sh','.md','.txt','.gdshader','.svg'}
          refs = []
          uid_refs = []
          for path in paths:
              if path.startswith('assets/cards/unit-card-') or path == '.github/workflows/legacy-monster-card-audit.yml':
                  continue
              if pathlib.Path(path).suffix.lower() not in ext:
                  continue
              try:
                  txt = pathlib.Path(path).read_text(encoding='utf-8',errors='replace')
              except (OSError,ValueError):
                  continue
              for index,line in enumerate(txt.splitlines(),1):
                  if 'unit-card-' in line or 'Catalog.image("unit"' in line or "Catalog.image('unit'" in line:
                      refs.append((path,index,line.strip()[:240]))
                  for uid in uids:
                      if uid in line:
                          uid_refs.append((path,index,uid))
          print('LEGACY_REFERENCE_COUNT:',len(refs))
          for entry in refs[:220]:
              print('LEGACY_REFERENCE:',*entry,sep=' | ')
          print('LEGACY_UID_REFERENCE_COUNT:',len(uid_refs))
          for entry in uid_refs[:120]:
              print('LEGACY_UID_REFERENCE:',*entry,sep=' | ')
          active_refs = [r for r in refs if pathlib.Path(r[0]).suffix.lower() not in {'.md','.txt'} and r[0] != '.github/workflows/all-live-layered-monster-cards.yml']
          active_uid_refs = [r for r in uid_refs if pathlib.Path(r[0]).suffix.lower() not in {'.md','.txt'}]
          print('ACTIVE_LEGACY_REFERENCES:',len(active_refs))
          print('ACTIVE_LEGACY_UID_REFERENCES:',len(active_uid_refs))
          if active_refs or active_uid_refs:
              print('AUDIT_RESULT: BLOCKED_BY_ACTIVE_REFERENCES')
              sys.exit(1)
          print('AUDIT_RESULT: NO_ACTIVE_REFERENCES')
          PY

  delete-verified-files:
    needs: legacy-asset-audit
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/audit/legacy-monster-card-cleanup-20261024' && startsWith(github.event.head_commit.message, 'chore: execute verified legacy card removal') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/legacy-monster-card-cleanup-20261024
      - name: Delete only approved retired PNGs and their import metadata
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' legacy < <(git ls-files -z 'assets/cards/unit-card-*')
          if [ "${#legacy[@]}" -ne 94 ]; then
            echo "Blocked: expected exactly 94 verified legacy files, got ${#legacy[@]}"
            exit 1
          fi
          png=0
          meta=0
          for path in "${legacy[@]}"; do
            if [[ "$path" =~ ^assets/cards/unit-card-[a-z0-9-]+\.png$ ]]; then
              ((png+=1))
              if [ ! -f "$path.import" ]; then echo "Missing matching import: $path"; exit 1; fi
            elif [[ "$path" =~ ^assets/cards/unit-card-[a-z0-9-]+\.png\.import$ ]]; then
              ((meta+=1))
              if [ ! -f "${path%.import}" ]; then echo "Missing matching PNG: $path"; exit 1; fi
            else
              echo "Unapproved deletion path: $path"
              exit 1
            fi
          done
          if [ "$png" -ne 47 ] || [ "$meta" -ne 47 ]; then
            echo "Blocked: expected 47 PNGs and 47 import files"
            exit 1
          fi
          printf '%s\0' "${legacy[@]}" | xargs -0 --no-run-if-empty git rm --
          echo "Deleted $png retired PNG cards and $meta import files in a single commit."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(cards): remove 47 unused flat monster PNGs and 47 import files"
          git push origin HEAD:audit/legacy-monster-card-cleanup-20261024
