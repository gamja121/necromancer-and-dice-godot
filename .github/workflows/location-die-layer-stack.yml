name: Location illustration die layer ordering
on:
  pull_request:
    paths:
      - "map.gd"
      - "systems/home_inheritance.gd"
      - "systems/place_actions.gd"
      - "systems/exploration_actions.gd"
      - "scripts/test_world_tree_direct_flow.gd"
      - "scripts/test_world_tree_direct_capture.gd"
      - "scripts/test_location_die_layer_stack.gd"
      - "scripts/test_location_notice_uniformity.gd"
      - "scripts/test_location_shared_capture.gd"
      - "systems/location_notice_strip.gd"
      - ".github/workflows/location-die-layer-stack.yml"
  push:
    branches: [main]
    paths:
      - "map.gd"
      - "systems/exploration_actions.gd"
      - "scripts/test_world_tree_direct_flow.gd"
      - "scripts/test_world_tree_direct_capture.gd"
      - "scripts/test_location_die_layer_stack.gd"
      - "scripts/test_location_notice_uniformity.gd"
      - "scripts/test_location_shared_capture.gd"
      - "systems/location_notice_strip.gd"
      - ".github/workflows/location-die-layer-stack.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layered-location-and-battle:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import and parse native Godot project
        shell: bash
        run: |
          set -euo pipefail
          timeout 200s godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|SHADER ERROR' import.log; then exit 1; fi
      - name: Verify home, inheritance, fortune, location and battle die layers
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s godot --headless --path . --script res://scripts/test_location_die_layer_stack.gd 2>&1 | tee layering.log
          grep -E '^LOCATION_DIE_LAYER_STACK: [0-9]+ passed, 0 failed$' layering.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|^FAIL location-layer-stack:' layering.log; then exit 1; fi
      - name: Check unchanged location art and input contract
        shell: bash
        run: |
          set -euo pipefail
          for spec in 'test_ui_location_layout_stage5s.gd:UI_LOCATION_LAYOUT_STAGE5S' 'test_ui_map_chrome_stage5r.gd:UI_MAP_CHROME_STAGE5R' 'test_shared_die_safety.gd:SHARED_DIE_SAFETY'; do
            script="${spec%%:*}"
            summary="${spec#*:}"
            timeout 225s godot --headless --path . --script "res://scripts/$script" 2>&1 | tee one.log
            grep -E "^$summary: [0-9]+ passed, 0 failed$" one.log
            if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|^FAIL ' one.log; then exit 1; fi
          done
      - name: Direct world tree rules persistence and single exit
        shell: bash
        run: |
          set -euo pipefail
          timeout 225s godot --headless --path . --script res://scripts/test_world_tree_direct_flow.gd 2>&1 | tee prayer.log
          grep -E '^WORLD_TREE_DIRECT_FLOW: [0-9]+ passed, 0 failed$' prayer.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB.*leaked|^FAIL ' prayer.log; then exit 1; fi
      - name: Native direct world tree and original prayer effect
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a -s '-screen 0 1600x900x24' godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 30 --script res://scripts/test_world_tree_direct_capture.gd 2>&1 | tee prayer-capture.log
          grep -E '^WORLD_TREE_DIRECT_CAPTURE: [0-9]+ passed, 0 failed$' prayer-capture.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB.*leaked|^FAIL ' prayer-capture.log; then exit 1; fi
          test -s world_tree_direct_01_ready.png
          test -s world_tree_direct_02_effect.png
          test -s world_tree_direct_03_result.png
          test -s world_tree_direct_04_reopened.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-tree-direct-ui-native
          path: world_tree_direct_*.png
          if-no-files-found: warn
      - name: Four title-free locations and durable rest recovery guidance
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s godot --headless --path . --script res://scripts/test_location_notice_uniformity.gd 2>&1 | tee shared.log
          grep -E '^LOCATION_NOTICE_UNIFORMITY: [0-9]+ passed, 0 failed$' shared.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB.*leaked|^FAIL fortune-direct:' shared.log; then exit 1; fi
      - name: Actual shared lower notices exit slots and original recovery effect
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a -s '-screen 0 1600x900x24' godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 30 --script res://scripts/test_location_shared_capture.gd 2>&1 | tee shared-capture.log
          grep -E '^LOCATION_SHARED_CAPTURE: [0-9]+ passed, 0 failed$' shared-capture.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB.*leaked|^FAIL uniformity:' shared-capture.log; then exit 1; fi
          test -s location_shared_01_graveyard_ready.png
          test -s location_shared_02_rest_ready.png
          test -s location_shared_04_prophecy_ready.png
          test -s location_shared_10_rest_heal_flash.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: location-shared-ui-native
          path: location_shared_*.png
          if-no-files-found: warn
      - name: Verify real embedded combat and return
        shell: bash
        run: |
          set -euo pipefail
          timeout 500s godot --headless --path . --script res://scripts/test_p4_combat_map_return_integration.gd 2>&1 | tee combat.log
          grep -E '^P4_COMBAT_MAP_RETURN_INTEGRATION: [0-9]+ passed, 0 failed$' combat.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|^FAIL p4-combat:' combat.log; then exit 1; fi
      - name: Check patch whitespace
        run: git diff --check
