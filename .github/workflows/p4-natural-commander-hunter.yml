name: P4 Natural Commander Hunter Story (Godot)

on:
  pull_request:
    paths:
      - "scripts/test_p4_natural_commander_hunter.gd"
      - "scripts/test_p4_natural_story_arrival.gd"
      - ".github/workflows/p4-natural-commander-hunter.yml"
      - "map.gd"
      - "systems/map_state.gd"
      - "systems/run_session.gd"
      - "systems/knight_commander_entry.gd"
      - "systems/knight_commander_beats.gd"
      - "systems/monster_hunter_entry.gd"
      - "systems/monster_hunter_beats.gd"
      - "docs/port_audit/migration_work_queue.tsv"
  push:
    branches: [main]
    paths:
      - "scripts/test_p4_natural_commander_hunter.gd"
      - "scripts/test_p4_natural_story_arrival.gd"
      - ".github/workflows/p4-natural-commander-hunter.yml"
      - "map.gd"
      - "systems/map_state.gd"
      - "systems/run_session.gd"
      - "systems/knight_commander_entry.gd"
      - "systems/knight_commander_beats.gd"
      - "systems/monster_hunter_entry.gd"
      - "systems/monster_hunter_beats.gd"
      - "docs/port_audit/migration_work_queue.tsv"
  workflow_dispatch:

permissions:
  contents: read

# Latest-commit-wins per branch/PR. Older same-workflow runs cannot waste
# Godot imports after a newer revision supersedes them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  natural-story:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical Godot project
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Import original runtime resources and script inheritance
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee p4-natural-chain-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' p4-natural-chain-import.log; then
            exit 1
          fi

      - name: Unshortened original die route child rescue village commander hunter and mid-dialogue resume
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 720s godot --headless --path . --script res://scripts/test_p4_natural_commander_hunter.gd 2>&1 | tee p4-natural-chain.log
          grep -E '^P4_NATURAL_COMMANDER_HUNTER: [0-9]+ passed, 0 failed$' p4-natural-chain.log
          grep -E '^P4_NATURAL_COMMANDER_HUNTER_ROUTE: [0-9]+ commander rolls, [0-9]+ hunter rolls, [0-9]+ original house shuffles$' p4-natural-chain.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|Invalid call|FAIL p4-natural:' p4-natural-chain.log; then
            exit 1
          fi
